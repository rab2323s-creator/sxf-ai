name: Update AI feed
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: sxf-feed-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile scripts/update_news.py scripts/ai_security_topic_template.py scripts/validate_site.py scripts/model_history.py scripts/source_adapters.py scripts/prepare_ai_enrichment.py scripts/ai_publish_quality.py scripts/run_ai_enrichment_pilot.py scripts/run_ai_auto_enrichment.py scripts/render_ai_enrichment_preview.py tests/test_source_adapters.py tests/test_ai_enrichment.py tests/test_ai_enrichment_pilot.py tests/test_ai_auto_enrichment.py tests/test_ai_enrichment_review.py
          node --check models/pricing/pricing.js
          node --check tools/ai-model-cost-calculator/calculator.js
          node --check models/explorer.js
          node --check compare/compare.js
          node --check evaluations/explorer/explorer.js
      - name: Source adapter contract tests
        run: python tests/test_source_adapters.py
      - name: AI enrichment dry-run tests
        run: |
          python tests/test_ai_enrichment.py
          python tests/test_ai_enrichment_pilot.py
          python tests/test_ai_auto_enrichment.py
      - name: Build feed and SEO HTML
        run: python scripts/update_news.py
      - name: Prepare AI enrichment candidates
        run: python scripts/prepare_ai_enrichment.py
      - name: Run guarded hot-news AI enrichment
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
        run: python scripts/run_ai_auto_enrichment.py
      - name: Rebuild routes after AI promotion
        if: github.event_name != 'pull_request'
        run: |
          python scripts/update_news.py
          python scripts/prepare_ai_enrichment.py
      - name: Render reviewed AI preview
        run: python scripts/render_ai_enrichment_preview.py
      - name: Review preview safeguards
        run: python tests/test_ai_enrichment_review.py
      - name: Validate generated site
        run: python scripts/validate_site.py
      - name: Commit generated changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "sxf-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh AI feed and SEO"
            git push
          fi
