name: Update AI feed
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: sxf-feed-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile scripts/update_news.py scripts/validate_site.py scripts/model_history.py
          node --check models/pricing/pricing.js
          node --check tools/ai-model-cost-calculator/calculator.js
          node --check models/explorer.js
      - name: Build feed and SEO HTML
        run: python scripts/update_news.py
      - name: Validate generated site
        run: python scripts/validate_site.py
      - name: Commit generated changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "sxf-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh AI feed and SEO"
            git push
          fi
