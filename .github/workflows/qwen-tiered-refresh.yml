name: Temporary Qwen pricing generated-artifact refresh
on:
  push:
    branches: [fix/qwen35-tiered-official-api-pricing-20261009]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild catalog, append-only history, and generated pages
        run: |
          python scripts/build_model_catalog.py
          python scripts/build_model_index.py
          python -c "from scripts.model_history import sync_model_history_file; print(sync_model_history_file('data/model-pricing.json','data/model-history.json'))"
          python scripts/update_news.py --render-only
          python scripts/ensure_compare_v2.py
          python scripts/ensure_model_evaluation_sections.py
          python tests/test_qwen_tiered_pricing.py
          python scripts/validate_site.py
      - name: Commit generated artifacts to this PR branch
        run: |
          git config user.name 'sxf-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build(qwen): regenerate validated tiered pricing pages and ledger'
            git push origin HEAD:fix/qwen35-tiered-official-api-pricing-20261009
          fi
