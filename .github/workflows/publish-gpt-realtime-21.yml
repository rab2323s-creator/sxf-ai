name: Publish GPT-Realtime-2.1 editorial model page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-gpt-realtime-21.yml"

permissions:
  contents: write

concurrency:
  group: publish-realtime-21-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the model editorial reference
        run: python tests/test_gpt_realtime_21_page.py
      - name: Regenerate only the target model HTML from its canonical sources
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import update_news
          from gpt_realtime_21_page import TITLE, CANONICAL
          items = json.loads(Path("data/news.json").read_text(encoding="utf-8"))["items"]
          html = update_news.render_catalog_model_page("gpt-realtime-2.1", items)
          assert TITLE in html and CANONICAL in html
          assert 'data-gpt-realtime21-guide' in html and 'data-model-history' in html
          Path("models/gpt-realtime-2-1/index.html").write_text(html, encoding="utf-8")
          PY
      - name: Commit only the updated model permalink
        run: |
          if git diff --quiet -- models/gpt-realtime-2-1/index.html; then
            echo "Model article already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/gpt-realtime-2-1/index.html
          git commit -m "build(models): publish GPT-Realtime-2.1 verified reference"
          git push origin HEAD:main
