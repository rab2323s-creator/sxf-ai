name: Build verified creative model batch
on:
  push:
    branches: [feat/verified-creative-audio-and-omni-2026-10]
    paths:
      - "data/model-catalog/providers/**"
      - "scripts/build_model_catalog.py"
      - "scripts/update_news.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: creative-model-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate catalog, indexes, history and SEO pages
        run: |
          python scripts/build_model_catalog.py
          python scripts/build_model_index.py
          python scripts/build_reverification_queue.py
          PYTHONPATH=scripts python -c 'from model_history import sync_model_history_file; print(sync_model_history_file("data/model-pricing.json", "data/model-history.json"))'
          python scripts/update_news.py --render-only
          python scripts/ensure_compare_v2.py
          python scripts/ensure_model_evaluation_sections.py
          python scripts/sitemap_lastmod.py --refresh
      - name: Validate source and rendered artifacts
        run: |
          python scripts/build_model_catalog.py --check
          python scripts/build_model_index.py --check
          python scripts/build_reverification_queue.py --check
          python scripts/validate_model_identity.py
          python scripts/validate_model_candidates.py
          python tests/test_model_catalog.py
          python scripts/validate_site.py
      - name: Commit generated artifacts on feature branch
        run: |
          git config user.name 'sxf-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate creative specialist pages and catalogs'
            git push origin HEAD:feat/verified-creative-audio-and-omni-2026-10
          fi
