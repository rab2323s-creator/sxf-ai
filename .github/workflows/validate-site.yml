name: Validate site changes

on:
  pull_request:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: sxf-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Single generator entrypoint regression
        run: python tests/test_single_entrypoint.py
      - name: Generator definition regression
        run: python tests/test_generator_definitions.py
      - name: Offline snapshot rendering unit tests
        run: python tests/test_snapshot_rendering.py
      - name: Signal processing regression tests
        run: python tests/test_signal_processing.py
      - name: Feed card rendering regression tests
        run: python tests/test_feed_card_rendering.py
      - name: Shared HTML shell and SEO regression tests
        run: python tests/test_html_shell.py
      - name: Signals index HTML and SEO regression tests
        run: python tests/test_signal_page_rendering.py
      - name: Signal article HTML and SEO regression tests
        run: python tests/test_signal_article_rendering.py
      - name: Model provider directory HTML and SEO regression tests
        run: python tests/test_model_provider_index_rendering.py
      - name: Syntax check
        run: |
          python -m py_compile scripts/ensure_compare_v2.py
          python -m py_compile scripts/ensure_model_evaluation_sections.py
          python -m py_compile scripts/sitemap_generation.py scripts/open_source_signals.py scripts/signal_processing.py scripts/feed_card_rendering.py scripts/html_shell.py scripts/signal_page_rendering.py scripts/signal_article_rendering.py scripts/model_provider_index_rendering.py scripts/update_news.py tests/test_signal_article_rendering.py tests/test_model_provider_index_rendering.py tests/test_feed_card_rendering.py tests/test_html_shell.py tests/test_signal_page_rendering.py tests/test_open_source_signals.py scripts/validate_site.py scripts/model_history.py scripts/source_adapters.py scripts/prepare_ai_enrichment.py scripts/ai_publish_quality.py scripts/run_ai_enrichment_pilot.py scripts/run_ai_auto_enrichment.py scripts/render_ai_enrichment_preview.py tests/test_source_adapters.py tests/test_ai_enrichment.py tests/test_ai_enrichment_pilot.py tests/test_ai_auto_enrichment.py tests/test_ai_enrichment_review.py
          node --check models/pricing/pricing.js
          node --check tools/ai-model-cost-calculator/calculator.js
          node --check models/explorer.js
          node --check compare/compare.js
          node --check compare/decision-engine.js
          node --check compare/decision-cockpit.js
          node --check tests/test_compare_engine.cjs
          node tests/test_compare_engine.cjs
          node --check evaluations/explorer/explorer.js
      - name: Verify priority independent evaluation evidence
        run: python tests/test_priority_evaluations.py
      - name: Validate 25-model independent benchmark expansion
        run: python tests/test_evaluation_coverage_25.py
      - name: Validate 35-model evaluation expansion
        run: python tests/test_evaluation_coverage_35.py
      - name: Source adapter contract tests
        run: python tests/test_source_adapters.py
      - name: AI enrichment dry-run tests
        run: |
          python tests/test_ai_enrichment.py
          python tests/test_ai_enrichment_pilot.py
          python tests/test_ai_auto_enrichment.py
      - name: Handle missing context sizes in generated evaluation explorer
        run: python scripts/patch_nullable_evaluation_context.py
      - name: Build site from current data and primary-source feeds
        run: python scripts/update_news.py
      - name: Open Source topic, page and filter regressions
        run: |
          python tests/test_open_source_signals.py
          node tests/test_open_source_filters.cjs
      - name: Verify offline HTML/SEO rebuild parity
        run: python tests/test_snapshot_rendering.py --parity
      - name: Compare output against legacy renderer
        run: |
          git fetch --no-tags origin main
          python tests/test_generator_equivalence.py --baseline origin/main
      - name: Restore and verify Compare V2 after regeneration
        run: |
          python scripts/ensure_compare_v2.py
          python scripts/ensure_compare_v2.py --check
          python tests/test_compare_regeneration.py
      - name: Restore model evaluation evidence cards after page generation
        run: |
          python scripts/ensure_model_evaluation_sections.py
          python scripts/ensure_model_evaluation_sections.py --check
      - name: Prepare AI enrichment candidates
        run: python scripts/prepare_ai_enrichment.py
      - name: Render reviewed AI preview
        run: python scripts/render_ai_enrichment_preview.py
      - name: Review preview safeguards
        run: python tests/test_ai_enrichment_review.py
      - name: Check shared pricing policy
        run: |
          node --check assets/pricing-policy.js
          node tests/test_pricing_policy.cjs
      - name: Verify synthetic support agent pilot fixtures (no API calls)
        run: |
          python tests/test_agent_support_pilot.py
          python tests/test_agent_support_local_pilot.py
      - name: Verify reproducible agent economics stress test
        run: node scripts/agent_economics_stress_test.cjs --check
      - name: Validate generated site
        run: python scripts/validate_site.py
      - name: Block cross-page pricing drift
        run: |
          python tests/test_pricing_regression.py
          python tests/test_qwen_tiered_pricing.py

  browser:
    name: Compare browser verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test Compare UI in desktop and mobile Chromium
        run: python tests/test_compare_browser.py
      - name: Keep browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-browser-screenshots
          path: compare-*-test.png
          if-no-files-found: ignore
