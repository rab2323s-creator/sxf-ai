name: Validate site changes

on:
  pull_request:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: sxf-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile scripts/update_news.py scripts/validate_site.py scripts/model_history.py
          node --check models/pricing/pricing.js
          node --check models/explorer.js
      - name: Build site from current data and primary-source feeds
        run: python scripts/update_news.py
      - name: Validate generated site
        run: python scripts/validate_site.py
