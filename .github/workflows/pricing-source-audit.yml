name: Audit external pricing signals

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricing-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate audit logic
        run: |
          python -m py_compile scripts/pricing_source_audit.py
          python -m unittest discover -s tests -p 'test_pricing_source_audit.py'
      - name: Check public price feeds
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/pricing_source_audit.py
      - name: Save discovery report (never overwrite official rates)
        run: |
          git config user.name "sxf-pricing-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pricing-source-audit.json
          if git diff --cached --quiet; then
            echo "No pricing audit changes"
          else
            git commit -m "chore: audit model pricing sources"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
