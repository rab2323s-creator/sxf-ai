name: Audit external pricing signals (read only)

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

# This workflow must never commit changes, edit canonical pricing, or deploy the site.
permissions:
  contents: read

concurrency:
  group: pricing-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate audit logic
        run: |
          python -m py_compile scripts/pricing_source_audit.py
          python -m unittest discover -s tests -p 'test_pricing_source_audit.py'
      - name: Check public price feeds (report only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/pricing_source_audit.py --output "$RUNNER_TEMP/pricing-source-audit.json"
      - name: Upload pricing discovery report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pricing-source-audit
          path: ${{ runner.temp }}/pricing-source-audit.json
          if-no-files-found: warn
          retention-days: 14
