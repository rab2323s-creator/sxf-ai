name: Enterprise agent economics research QA (read only)
on:
  push:
    branches: [feature/enterprise-agent-economics-study, fix/agent-cost-responsive-image-access]
    paths:
      - "guides/ai-agent-cost/**"
      - "data/enterprise-agent-economics-assumptions.json"
      - "data/agent-economics-stress-test.json"
      - "scripts/agent_economics_stress_test.cjs"
      - "tests/test_enterprise_agent_economics.cjs"
      - "tests/test_enterprise_agent_economics_browser.py"
      - "scripts/update_news.py"
      - "scripts/sitemap_generation.py"
      - "sitemap.xml"
      - ".github/workflows/enterprise-agent-economics-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify static JavaScript
        run: node --check guides/ai-agent-cost/study.js
      - name: Verify 375 deterministic sensitivity combinations and published snapshot
        run: node scripts/agent_economics_stress_test.cjs --check
      - name: Verify model rates, study arithmetic, HTML and SEO
        run: node tests/test_enterprise_agent_economics.cjs
      - name: Verify generator syntax
        run: python3 -m py_compile scripts/update_news.py scripts/sitemap_generation.py
      - name: Install Chromium browser test dependencies
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Test research UI in real desktop and mobile Chromium
        run: python3 tests/test_enterprise_agent_economics_browser.py
      - name: Upload browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economics-browser-screenshots
          path: econ-study-*-test.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Package read-only research preview
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-agent-economics-review
          retention-days: 7
          if-no-files-found: error
          path: |
            guides/ai-agent-cost/
            data/enterprise-agent-economics-assumptions.json
            data/model-pricing.json
            styles.css
            intelligence.css
