<title id="title">Claude Mythos and AMD MI355X: a three-day, narrowly scoped port</title>
<desc id="desc">Editorial diagram: Claude Mythos assisted GPU kernel work to bring prompt processing for one Anthropic model to AMD MI355X; Nvidia CUDA's broader ecosystem is not measured by the claim.</desc>
