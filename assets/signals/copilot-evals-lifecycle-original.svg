<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Copilot Evals: test and compare</title><desc id="desc">A passing test checks a scenario, not universal agent safety. DEFINE – Saved test cases – Expected task outcomes; RUN – Approve each trial – Inspect pass/fail checks; COMPARE – Review a changed skill – Keep controls consistent</desc><rect width="1200" height="630" rx="26" fill="#0a1726"/><rect x="1" y="1" width="1198" height="628" rx="25" stroke="#3c5876" fill="none"/><circle cx="1080" cy="100" r="185" fill="#70ebce" opacity=".06"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="66" fill="#70ebce" font-size="19" font-weight="800" letter-spacing="2">SXF / AI   ·   AGENT EVALUATION</text><text x="50" y="138" fill="#f6f9ff" font-size="42" font-weight="800">Copilot Evals: test and compare</text><text x="50" y="186" fill="#bbcede" font-size="21">A passing test checks a scenario, not universal agent safety.</text><path d="M50 227 H1150" stroke="#35526b" stroke-width="2"/><g><rect x="50" y="265" width="360" height="218" rx="16" fill="#142637" stroke="#426079"/><text x="72" y="318" fill="#74e9cf" font-weight="800" font-size="20">DEFINE</text><text x="72" y="374" fill="#eff8ff" font-weight="700" font-size="24">Saved test cases</text><text x="72" y="421" fill="#b9cfe2" font-size="18">Expected task outcomes</text></g><g><rect x="428" y="265" width="360" height="218" rx="16" fill="#142637" stroke="#426079"/><text x="450" y="318" fill="#74e9cf" font-weight="800" font-size="20">RUN</text><text x="450" y="374" fill="#eff8ff" font-weight="700" font-size="24">Approve each trial</text><text x="450" y="421" fill="#b9cfe2" font-size="18">Inspect pass/fail checks</text></g><g><rect x="806" y="265" width="360" height="218" rx="16" fill="#142637" stroke="#426079"/><text x="828" y="318" fill="#74e9cf" font-weight="800" font-size="20">COMPARE</text><text x="828" y="374" fill="#eff8ff" font-weight="700" font-size="24">Review a changed skill</text><text x="828" y="421" fill="#b9cfe2" font-size="18">Keep controls consistent</text></g><path d="M50 522 H1150" stroke="#35526b"/><text x="50" y="562" fill="#b8cede" font-size="18">SXF methodology visual  ·  Based on GitHub's Nov 17 preview</text><text x="1150" y="598" text-anchor="end" fill="#70ebce" font-size="18">SXF.SI / ORIGINAL EDITORIAL VISUAL</text></g></svg>