<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Sales plugin: context to action</title><desc id="desc">Connected context does not automatically authorize a CRM write. RETRIEVE – Account + CRM context – Check freshness and scope; PREPARE – Briefs and next steps – Review sources and claims; APPROVE – Human-confirmed action – Keep CRM audit records</desc><rect width="1200" height="630" rx="26" fill="#0a1726"/><rect x="1" y="1" width="1198" height="628" rx="25" stroke="#3c5876" fill="none"/><circle cx="1080" cy="100" r="185" fill="#70ebce" opacity=".06"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="66" fill="#70ebce" font-size="19" font-weight="800" letter-spacing="2">SXF / AI   ·   SALES SYSTEMS</text><text x="50" y="138" fill="#f6f9ff" font-size="42" font-weight="800">Sales plugin: context to action</text><text x="50" y="186" fill="#bbcede" font-size="21">Connected context does not automatically authorize a CRM write.</text><path d="M50 227 H1150" stroke="#35526b" stroke-width="2"/><g><rect x="50" y="265" width="360" height="218" rx="16" fill="#142637" stroke="#426079"/><text x="72" y="318" fill="#74e9cf" font-weight="800" font-size="20">RETRIEVE</text><text x="72" y="374" fill="#eff8ff" font-weight="700" font-size="24">Account + CRM context</text><text x="72" y="421" fill="#b9cfe2" font-size="18">Check freshness and scope</text></g><g><rect x="428" y="265" width="360" height="218" rx="16" fill="#142637" stroke="#426079"/><text x="450" y="318" fill="#74e9cf" font-weight="800" font-size="20">PREPARE</text><text x="450" y="374" fill="#eff8ff" font-weight="700" font-size="24">Briefs and next steps</text><text x="450" y="421" fill="#b9cfe2" font-size="18">Review sources and claims</text></g><g><rect x="806" y="265" width="360" height="218" rx="16" fill="#142637" stroke="#426079"/><text x="828" y="318" fill="#74e9cf" font-weight="800" font-size="20">APPROVE</text><text x="828" y="374" fill="#eff8ff" font-weight="700" font-size="24">Human-confirmed action</text><text x="828" y="421" fill="#b9cfe2" font-size="18">Keep CRM audit records</text></g><path d="M50 522 H1150" stroke="#35526b"/><text x="50" y="562" fill="#b8cede" font-size="18">SXF editorial workflow map  ·  Based on OpenAI's Nov 17 announcement</text><text x="1150" y="598" text-anchor="end" fill="#70ebce" font-size="18">SXF.SI / ORIGINAL EDITORIAL VISUAL</text></g></svg>