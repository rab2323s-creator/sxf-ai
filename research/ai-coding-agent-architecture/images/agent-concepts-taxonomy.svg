<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="THE FIVE ARCHITECTURAL ROLES"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080c16"/><stop offset="1" stop-color="#13203a"/></linearGradient><pattern id="grid" width="65" height="65" patternUnits="userSpaceOnUse"><path d="M65 0H0V65" stroke="#8faaff" stroke-opacity=".08" fill="none"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#000" flood-opacity=".5"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><path d="M70 236H1530" stroke="#97afe0" stroke-opacity=".25"/><text x="72" y="84" fill="#88f1d9" font-size="23" letter-spacing="5" font-family="Arial,sans-serif" font-weight="700">SXF / AI   ·   ORIGINAL RESEARCH VISUAL</text><text x="72" y="149" fill="#f2f5ff" font-size="52" font-family="Arial,sans-serif" font-weight="800">THE FIVE ARCHITECTURAL ROLES</text><text x="74" y="197" fill="#a6b9d0" font-size="24" font-family="Arial,sans-serif">Do not confuse interfaces, workers, packages, instructions and outcomes</text><rect x="75" y="268" width="1450" height="100" rx="18" fill="#16263d" stroke="#baa0fb" stroke-opacity=".52"/><text x="108" y="329" fill="#baa0fb" font-family="Arial,sans-serif" font-weight="800" font-size="30">01</text><text x="208" y="326" fill="#f0f5ff" font-family="Arial,sans-serif" font-weight="700" font-size="27">SUBAGENT</text><text x="575" y="326" fill="#baa0fb" font-family="Arial,sans-serif" font-weight="700" font-size="26">delegated worker</text><text x="1066" y="326" fill="#b8c9df" font-family="Arial,sans-serif" font-size="22">Distinct task and context</text><rect x="75" y="380" width="1450" height="100" rx="18" fill="#16263d" stroke="#86e9e0" stroke-opacity=".52"/><text x="108" y="441" fill="#86e9e0" font-family="Arial,sans-serif" font-weight="800" font-size="30">02</text><text x="208" y="438" fill="#f0f5ff" font-family="Arial,sans-serif" font-weight="700" font-size="27">TOOL / FUNCTION</text><text x="575" y="438" fill="#86e9e0" font-family="Arial,sans-serif" font-weight="700" font-size="26">callable capability</text><text x="1066" y="438" fill="#b8c9df" font-family="Arial,sans-serif" font-size="22">Typed input, host execution</text><rect x="75" y="492" width="1450" height="100" rx="18" fill="#16263d" stroke="#a4bdfe" stroke-opacity=".52"/><text x="108" y="553" fill="#a4bdfe" font-family="Arial,sans-serif" font-weight="800" font-size="30">03</text><text x="208" y="550" fill="#f0f5ff" font-family="Arial,sans-serif" font-weight="700" font-size="27">PLUGIN</text><text x="575" y="550" fill="#a4bdfe" font-family="Arial,sans-serif" font-weight="700" font-size="26">distribution package</text><text x="1066" y="550" fill="#b8c9df" font-family="Arial,sans-serif" font-size="22">Bundles integration components</text><rect x="75" y="604" width="1450" height="100" rx="18" fill="#16263d" stroke="#e9c58c" stroke-opacity=".52"/><text x="108" y="665" fill="#e9c58c" font-family="Arial,sans-serif" font-weight="800" font-size="30">04</text><text x="208" y="662" fill="#f0f5ff" font-family="Arial,sans-serif" font-weight="700" font-size="27">SKILL</text><text x="575" y="662" fill="#e9c58c" font-family="Arial,sans-serif" font-weight="700" font-size="26">workflow instructions</text><text x="1066" y="662" fill="#b8c9df" font-family="Arial,sans-serif" font-size="22">Guidance, not authorization</text><rect x="75" y="716" width="1450" height="100" rx="18" fill="#16263d" stroke="#f4a6c1" stroke-opacity=".52"/><text x="108" y="777" fill="#f4a6c1" font-family="Arial,sans-serif" font-weight="800" font-size="30">05</text><text x="208" y="774" fill="#f0f5ff" font-family="Arial,sans-serif" font-weight="700" font-size="27">ACTION</text><text x="575" y="774" fill="#f4a6c1" font-family="Arial,sans-serif" font-weight="700" font-size="26">state transition</text><text x="1066" y="774" fill="#b8c9df" font-family="Arial,sans-serif" font-size="22">Attempted and recorded effect</text><text x="73" y="862" fill="#7187a6" font-family="Arial,sans-serif" font-size="20" letter-spacing="2">REFERENCE ARCHITECTURE · CONCEPTUAL DIAGRAM, NOT A PRODUCT BENCHMARK</text></svg>