<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
<title id="title">The SXF AI Agent Memory Loop</title>
<desc id="desc">A research infographic showing how AI agents observe, select, store, consolidate, retrieve, act and forget across working, episodic, semantic and procedural memory.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080d"/><stop offset=".55" stop-color="#0b111b"/><stop offset="1" stop-color="#111623"/></linearGradient>
<linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#63e8ff"/><stop offset=".33" stop-color="#7df2d0"/><stop offset=".66" stop-color="#9c8cff"/><stop offset="1" stop-color="#f0a65b"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#77f3ff" stop-opacity=".95"/><stop offset=".4" stop-color="#4fa8ff" stop-opacity=".5"/><stop offset="1" stop-color="#101826" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1672" height="941" fill="url(#bg)"/>
<g opacity=".11" stroke="#9fb2d0"><path d="M0 120H1672M0 240H1672M0 360H1672M0 480H1672M0 600H1672M0 720H1672M0 840H1672"/><path d="M120 0V941M360 0V941M600 0V941M840 0V941M1080 0V941M1320 0V941M1560 0V941"/></g>
<text x="92" y="105" fill="#8ff5da" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="5">SXF / AI · RESEARCH FRAMEWORK · 2026</text>
<text x="92" y="187" fill="#f7f9ff" font-family="Arial,Helvetica,sans-serif" font-size="59" font-weight="800">THE AI AGENT MEMORY LOOP</text>
<text x="92" y="234" fill="#9faec6" font-family="Arial,Helvetica,sans-serif" font-size="25">Good memory is not “store everything.” It is selective state management across time.</text>

<g transform="translate(836 485)">
<circle r="158" fill="url(#core)" opacity=".7"/>
<circle r="104" fill="#0b1522" stroke="#6ee9ff" stroke-width="3" filter="url(#glow)"/>
<circle r="72" fill="#0d1b2d" stroke="#7df2d0" stroke-width="2"/>
<text y="-16" text-anchor="middle" fill="#7df2d0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="3">AI AGENT</text>
<text y="20" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800">MEMORY</text>
<text y="49" text-anchor="middle" fill="#a7b5cb" font-family="Arial,Helvetica,sans-serif" font-size="14">state across time</text>
</g>

<g fill="none" stroke="url(#flow)" stroke-width="8" stroke-linecap="round" opacity=".9" filter="url(#glow)">
<path d="M255 515 C390 360 520 350 680 430"/>
<path d="M680 430 C720 380 770 355 836 350"/>
<path d="M836 350 C930 345 980 390 1015 438"/>
<path d="M1015 438 C1150 350 1280 390 1400 515"/>
<path d="M1400 515 C1290 660 1160 680 1010 620"/>
<path d="M1010 620 C960 690 900 715 836 716"/>
<path d="M836 716 C720 718 655 665 620 605"/>
<path d="M620 605 C470 675 335 655 255 515"/>
</g>

<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(246 515)"><circle r="54" fill="#0b1520" stroke="#63e8ff" stroke-width="3"/><text y="7" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">1</text><text x="-58" y="-84" fill="#f6f8ff" font-size="24" font-weight="800">OBSERVE</text><text x="-78" y="-55" fill="#9fadc4" font-size="15">user · tools · world</text></g>
<g transform="translate(515 370)"><circle r="54" fill="#0c171d" stroke="#6fe9df" stroke-width="3"/><text y="7" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">2</text><text x="-53" y="-82" fill="#f6f8ff" font-size="24" font-weight="800">SELECT</text><text x="-77" y="-54" fill="#9fadc4" font-size="15">what matters?</text></g>
<g transform="translate(760 326)"><circle r="54" fill="#0d171d" stroke="#7df2d0" stroke-width="3"/><text y="7" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">3</text><text x="-42" y="-82" fill="#f6f8ff" font-size="24" font-weight="800">STORE</text><text x="-75" y="-54" fill="#9fadc4" font-size="15">persist with provenance</text></g>
<g transform="translate(1080 365)"><circle r="54" fill="#111526" stroke="#9c8cff" stroke-width="3"/><text y="7" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">4</text><text x="-80" y="-82" fill="#f6f8ff" font-size="24" font-weight="800">CONSOLIDATE</text><text x="-88" y="-54" fill="#9fadc4" font-size="15">summarize · link · revise</text></g>
<g transform="translate(1422 515)"><circle r="54" fill="#131427" stroke="#a78dff" stroke-width="3"/><text y="7" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">5</text><text x="-62" y="-84" fill="#f6f8ff" font-size="24" font-weight="800">RETRIEVE</text><text x="-80" y="-55" fill="#9fadc4" font-size="15">right memory · right time</text></g>
<g transform="translate(1120 675)"><circle r="54" fill="#18131e" stroke="#d69a71" stroke-width="3"/><text y="7" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">6</text><text x="-28" y="92" fill="#f6f8ff" font-size="24" font-weight="800">ACT</text><text x="-72" y="120" fill="#9fadc4" font-size="15">memory changes behavior</text></g>
<g transform="translate(570 680)"><circle r="54" fill="#18151b" stroke="#f0a65b" stroke-width="3"/><text y="7" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">7</text><text x="-52" y="92" fill="#f6f8ff" font-size="24" font-weight="800">FORGET</text><text x="-92" y="120" fill="#9fadc4" font-size="15">expire · delete · supersede</text></g>
</g>

<g font-family="Arial,Helvetica,sans-serif">
<rect x="95" y="755" width="1482" height="112" rx="20" fill="#0a1019" stroke="#27364c"/>
<text x="124" y="790" fill="#8ff5da" font-size="16" font-weight="700" letter-spacing="3">FOUR MEMORY ROLES</text>
<g transform="translate(125 816)"><text fill="#63e8ff" font-size="18" font-weight="800">WORKING</text><text x="104" fill="#9faec6" font-size="15">current task state</text></g>
<g transform="translate(445 816)"><text fill="#7df2d0" font-size="18" font-weight="800">EPISODIC</text><text x="108" fill="#9faec6" font-size="15">past events & trajectories</text></g>
<g transform="translate(805 816)"><text fill="#9c8cff" font-size="18" font-weight="800">SEMANTIC</text><text x="112" fill="#9faec6" font-size="15">facts, entities & preferences</text></g>
<g transform="translate(1190 816)"><text fill="#f0a65b" font-size="18" font-weight="800">PROCEDURAL</text><text x="126" fill="#9faec6" font-size="15">workflows & learned skills</text></g>
<text x="124" y="850" fill="#79869b" font-size="14">The reliable memory system is the one that can write less, retrieve better, revise stale state and forget on purpose.</text>
</g>
</svg>