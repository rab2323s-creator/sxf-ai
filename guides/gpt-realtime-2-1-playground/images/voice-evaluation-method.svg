<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">SXF Voice Agent Evidence Pipeline</title><desc id="desc">An evidence-first evaluation workflow connects test audio, real-time model, tool permissions and verified business state.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121f"/><stop offset=".52" stop-color="#0b2940"/><stop offset="1" stop-color="#071422"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c4660"/><stop offset="1" stop-color="#102536"/></linearGradient><filter id="shade"><feDropShadow dx="0" dy="9" stdDeviation="20" flood-color="#000" flood-opacity=".5"/></filter><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ce4ef"/></marker></defs><rect width="1280" height="720" rx="28" fill="url(#bg)"/><g opacity=".15" stroke="#58c6ef"><path d="M0 158h1280M0 320h1280M0 482h1280M0 644h1280"/><path d="M0 0v720"/><path d="M80 0v720"/><path d="M160 0v720"/><path d="M240 0v720"/><path d="M320 0v720"/><path d="M400 0v720"/><path d="M480 0v720"/><path d="M560 0v720"/><path d="M640 0v720"/><path d="M720 0v720"/><path d="M800 0v720"/><path d="M880 0v720"/><path d="M960 0v720"/><path d="M1040 0v720"/><path d="M1120 0v720"/><path d="M1200 0v720"/><path d="M1280 0v720"/></g><text x="72" y="90" font-family="Arial" font-weight="800" font-size="34" fill="#edf7ff">SXF Voice Agent Evaluation Pipeline</text><text x="73" y="126" font-family="Arial" font-size="17" fill="#a5cadb">An original protocol: capture evidence at every boundary, not just the final transcript.</text><g filter="url(#shade)"><rect x="66" y="226" width="220" height="244" rx="21" fill="url(#card)" stroke="#58d6e9" stroke-width="2"/><rect x="84" y="242" width="99" height="29" rx="14" fill="#58d6e9" opacity=".16"/><text x="92" y="261" fill="#58d6e9" font-size="12" font-family="Arial" font-weight="800">CONTROL</text><text x="84" y="309" fill="#f2fbff" font-size="17" font-family="Arial" font-weight="800">01  TEST INPUT</text><circle cx="93" cy="343" r="4" fill="#58d6e9"/><text x="106" y="348" fill="#bed6e4" font-size="13" font-family="Arial">Frozen reference audio</text><circle cx="93" cy="379" r="4" fill="#58d6e9"/><text x="106" y="384" fill="#bed6e4" font-size="13" font-family="Arial">Prompt + device + VAD</text><circle cx="93" cy="415" r="4" fill="#58d6e9"/><text x="106" y="420" fill="#bed6e4" font-size="13" font-family="Arial">Expected outcome</text></g><g filter="url(#shade)"><rect x="378" y="226" width="220" height="244" rx="21" fill="url(#card)" stroke="#9adcf7" stroke-width="2"/><rect x="396" y="242" width="99" height="29" rx="14" fill="#9adcf7" opacity=".16"/><text x="404" y="261" fill="#9adcf7" font-size="12" font-family="Arial" font-weight="800">EXECUTION</text><text x="396" y="309" fill="#f2fbff" font-size="17" font-family="Arial" font-weight="800">02  LIVE SESSION</text><circle cx="405" cy="343" r="4" fill="#9adcf7"/><text x="418" y="348" fill="#bed6e4" font-size="13" font-family="Arial">Exact model + settings</text><circle cx="405" cy="379" r="4" fill="#9adcf7"/><text x="418" y="384" fill="#bed6e4" font-size="13" font-family="Arial">Turn and event timeline</text><circle cx="405" cy="415" r="4" fill="#9adcf7"/><text x="418" y="420" fill="#bed6e4" font-size="13" font-family="Arial">Token usage per modality</text></g><g filter="url(#shade)"><rect x="690" y="226" width="220" height="244" rx="21" fill="url(#card)" stroke="#c5f17c" stroke-width="2"/><rect x="708" y="242" width="99" height="29" rx="14" fill="#c5f17c" opacity=".16"/><text x="716" y="261" fill="#c5f17c" font-size="12" font-family="Arial" font-weight="800">AUTHORIZATION</text><text x="708" y="309" fill="#f2fbff" font-size="17" font-family="Arial" font-weight="800">03  TOOL POLICY</text><circle cx="717" cy="343" r="4" fill="#c5f17c"/><text x="730" y="348" fill="#bed6e4" font-size="13" font-family="Arial">Approval + allowlist</text><circle cx="717" cy="379" r="4" fill="#c5f17c"/><text x="730" y="384" fill="#bed6e4" font-size="13" font-family="Arial">Inspect tool arguments</text><circle cx="717" cy="415" r="4" fill="#c5f17c"/><text x="730" y="420" fill="#bed6e4" font-size="13" font-family="Arial">Record tool response</text></g><g filter="url(#shade)"><rect x="1002" y="226" width="220" height="244" rx="21" fill="url(#card)" stroke="#d4b5ff" stroke-width="2"/><rect x="1020" y="242" width="99" height="29" rx="14" fill="#d4b5ff" opacity=".16"/><text x="1028" y="261" fill="#d4b5ff" font-size="12" font-family="Arial" font-weight="800">OUTCOME</text><text x="1020" y="309" fill="#f2fbff" font-size="17" font-family="Arial" font-weight="800">04  VERIFIED STATE</text><circle cx="1029" cy="343" r="4" fill="#d4b5ff"/><text x="1042" y="348" fill="#bed6e4" font-size="13" font-family="Arial">Did the task complete?</text><circle cx="1029" cy="379" r="4" fill="#d4b5ff"/><text x="1042" y="384" fill="#bed6e4" font-size="13" font-family="Arial">Was speech consistent?</text><circle cx="1029" cy="415" r="4" fill="#d4b5ff"/><text x="1042" y="420" fill="#bed6e4" font-size="13" font-family="Arial">Count failures + retries</text></g><path d="M298 350h58" stroke="#65e0ec" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)"/><path d="M610 350h58" stroke="#65e0ec" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)"/><path d="M922 350h58" stroke="#65e0ec" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)"/><rect x="66" y="523" width="1148" height="102" rx="17" fill="#081927" stroke="#315a66"/><text x="92" y="563" fill="#c8f884" font-size="17" font-family="Arial" font-weight="700">SCORE SEPARATELY:</text><text x="92" y="597" fill="#c3e6f3" font-size="18" font-family="Arial">Correctness    ·    Barge-in    ·    Tool safety    ·    First useful audio    ·    Cost per accepted task</text><text x="73" y="677" font-size="15" font-family="Arial" fill="#8eadbc">PROTOCOL / NOT A MEASURED BENCHMARK     •     SXF / AI ORIGINAL RESEARCH DESIGN</text></svg>