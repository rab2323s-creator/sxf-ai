<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Three conditional SXF AI bubble scenarios 2027 to 2030</title><desc id="d">Three possible pathways: productivity-led expansion, selective investment digestion and a wider financing shock. No probabilities are assigned.</desc><rect width="1200" height="620" fill="#0a1518"/><rect x="24" y="24" width="1152" height="572" rx="26" fill="#14221d" stroke="#41654b" stroke-width="2"/><text x="65" y="90" font-family="Arial,sans-serif" font-size="21" fill="#c8ff4d" font-weight="bold" letter-spacing="4">SXF / 2027–2030 CONDITIONAL SCENARIOS</text><text x="65" y="140" font-family="Arial,sans-serif" font-size="38" fill="#ecffec" font-weight="bold">Three paths. No fabricated crash probability.</text><g font-family="Arial,sans-serif"><rect x="65" y="202" width="342" height="284" rx="14" fill="#173c2a" stroke="#659873" stroke-width="2"/><text x="85" y="247" fill="#c8ff4d" font-size="22" font-weight="bold">A / EXPANSION</text><text x="85" y="296" fill="#edffef" font-size="25" font-weight="bold">Payback improves</text><text x="85" y="350" fill="#c1dbcb" font-size="18">Demand → utilization</text><text x="85" y="384" fill="#c1dbcb" font-size="18">→ durable earnings</text><text x="85" y="451" fill="#c8ff4d" font-size="15" font-weight="bold">Conditional, not guaranteed</text><rect x="429" y="202" width="342" height="284" rx="14" fill="#21382f" stroke="#6e8e7d" stroke-width="2"/><text x="449" y="247" fill="#b7eec5" font-size="22" font-weight="bold">B / DIGESTION</text><text x="449" y="296" fill="#edffef" font-size="25" font-weight="bold">Selective correction</text><text x="449" y="350" fill="#c1dbcb" font-size="18">Capex pause → project cuts</text><text x="449" y="384" fill="#c1dbcb" font-size="18">→ survivors consolidate</text><text x="449" y="451" fill="#b7eec5" font-size="15" font-weight="bold">Conditional, not guaranteed</text><rect x="793" y="202" width="342" height="284" rx="14" fill="#342b24" stroke="#a58464" stroke-width="2"/><text x="813" y="247" fill="#ffd39a" font-size="22" font-weight="bold">C / FINANCING SHOCK</text><text x="813" y="296" fill="#edffef" font-size="25" font-weight="bold">Credit stress spreads</text><text x="813" y="350" fill="#d6c4ad" font-size="18">Debt → funding squeeze</text><text x="813" y="384" fill="#d6c4ad" font-size="18">→ jobs &amp; demand at risk</text><text x="813" y="451" fill="#ffd39a" font-size="15" font-weight="bold">Conditional, not guaranteed</text></g><text x="65" y="550" font-family="Arial,sans-serif" font-size="19" fill="#c1d3c6">Model mechanisms and falsification signals are explained in the article.</text></svg>