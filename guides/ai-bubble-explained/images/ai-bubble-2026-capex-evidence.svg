<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">2026 company-wide capital spending guidance for Amazon, Alphabet and Meta</title><desc id="d">Amazon approximately 220 billion dollars, Alphabet 195 to 205 billion dollars and Meta 135 to 145 billion dollars. These figures are company-wide and use different accounting definitions.</desc><rect width="1200" height="620" fill="#0c1519"/><rect x="24" y="24" width="1152" height="572" rx="26" fill="#12231e" stroke="#416b4c" stroke-width="2"/><text x="64" y="93" font-family="Arial,sans-serif" font-size="21" letter-spacing="4" font-weight="bold" fill="#c8ff4d">SXF / COMPANY-REPORTED 2026 CAPEX</text><text x="64" y="141" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="#f0fff1">The investment scale, with its accounting caveats</text><g font-family="Arial,sans-serif"><text x="62" y="232" font-size="24" fill="#e9ffee" font-weight="bold">Amazon</text><rect x="290" y="194" width="650" height="50" rx="8" fill="#254435"/><rect x="290" y="194" width="650" height="50" rx="8" fill="#c8ff4d"/><text x="960" y="230" font-size="25" font-weight="bold" fill="#eafde8">~$220B</text><text x="62" y="326" font-size="24" fill="#e9ffee" font-weight="bold">Alphabet</text><rect x="290" y="288" width="650" height="50" rx="8" fill="#254435"/><rect x="290" y="288" width="591" height="50" rx="8" fill="#a2e2bb"/><text x="899" y="326" font-size="25" font-weight="bold" fill="#eafde8">$195–205B</text><text x="62" y="421" font-size="24" fill="#e9ffee" font-weight="bold">Meta</text><rect x="290" y="383" width="650" height="50" rx="8" fill="#254435"/><rect x="290" y="383" width="414" height="50" rx="8" fill="#73bcb3"/><text x="721" y="421" font-size="25" font-weight="bold" fill="#eafde8">$135–145B</text></g><rect x="61" y="479" width="1073" height="79" rx="12" fill="#24342b"/><text x="82" y="512" font-family="Arial,sans-serif" font-size="17" fill="#daefdd">2026 spending outlook. 