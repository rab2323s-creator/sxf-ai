<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">How an AI bubble could affect households</title><desc id="d">Financial markets, data center investment and AI revenues transmit through jobs, savings, electricity bills and software services. Arrows show conditional links only.</desc><rect width="1200" height="620" fill="#0a1518"/><rect x="24" y="24" width="1152" height="572" rx="27" fill="#12231f" stroke="#416b4d" stroke-width="2"/><text x="68" y="91" font-family="Arial,sans-serif" font-size="21" fill="#c8ff4d" font-weight="bold" letter-spacing="4">SXF / ORIGINAL ECONOMIC TRANSMISSION MAP</text><text x="68" y="146" font-family="Arial,sans-serif" font-size="39" fill="#f2fff2" font-weight="bold">From the AI trade to your everyday life</text><g font-family="Arial,sans-serif"><rect x="70" y="205" width="255" height="250" rx="15" fill="#1c3d2d" stroke="#64976a"/><text x="88" y="258" font-size="18" fill="#c8ff4d" font-weight="bold">AI CAPITAL CYCLE</text><text x="88" y="315" font-size="25" fill="#efffee" font-weight="bold">Investment</text><text x="88" y="352" font-size="25" fill="#efffee" font-weight="bold">Valuations</text><text x="88" y="389" font-size="25" fill="#efffee" font-weight="bold">Credit</text><path d="M335 330 L440 330" stroke="#c8ff4d" stroke-width="6"/><path d="M427 314 L450 330 L427 346" fill="none" stroke="#c8ff4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="205" width="250" height="250" rx="15" fill="#17302c" stroke="#4f8077"/><text x="483" y="255" font-size="17" fill="#9bdacd" font-weight="bold">ECONOMIC CHANNEL</text><text x="483" y="308" font-size="22" fill="#f1fff0" font-weight="bold">Earnings &amp; jobs</text><text x="483" y="346" font-size="22" fill="#f1fff0" font-weight="bold">Asset prices</text><text x="483" y="384" font-size="22" fill="#f1fff0" font-weight="bold">Grid contracts</text><path d="M717 330 L810 330" stroke="#c8ff4d" stroke-width="6"/><path d="M797 314 L820 330 L797 346" fill="none" stroke="#c8ff4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="830" y="205" width="302" height="250" rx="15" fill="#193726" stroke="#68956b"/><text x="850" y="255" font-size="18" fill="#c8ff4d" font-weight="bold">HOUSEHOLD CONSEQUENCE</text><text x="850" y="306" font-size="24" fill="#f0fff0" font-weight="bold">Your job</text><text x="850" y="344" font-size="24" fill="#f0fff0" font-weight="bold">Your savings</text><text x="850" y="382" font-size="24" fill="#f0fff0" font-weight="bold">Your bills &amp; AI apps</text></g><text x="68" y="539" font-family="Arial,sans-serif" font-size="19" fill="#b9d1c1">Possible pathways, not inevitable outcomes. No crash forecast or implied probability.</text></svg>