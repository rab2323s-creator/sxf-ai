<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">Text-to-speech model evaluation pipeline</title><desc id="desc">Seven-stage workflow showing controlled transcript corpus, generated speech, independent transcription for WER and CER, speaker similarity, speed and cost, bilingual human listening, and aggregated decision-making.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09111f"/><stop offset="1" stop-color="#112c3c"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#82c6dc" stroke-width="2"/></marker></defs><rect width="1440" height="810" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="75" y="81" fill="#8bbfd8" font-size="23" letter-spacing="4">REPRODUCIBLE TTS EVALUATION</text><text x="75" y="149" fill="#fff" font-size="49" font-weight="700">Sound natural. Say the right words. Ship fast.</text><text x="75" y="194" fill="#b5cade" font-size="22">A decision framework, not a fabricated ranking or lab score.</text></g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="70" y="260" width="271" height="161" rx="22" fill="#16324d" stroke="#4a9dce" stroke-width="2"/><text x="205" y="307" fill="#8dd4ff" font-size="20">01 / DATASET</text><text x="205" y="349" fill="white" font-size="25" font-weight="700">Same transcripts</text><text x="205" y="385" fill="#bdd2e1" font-size="18">Languages · accents</text>
<rect x="410" y="260" width="275" height="161" rx="22" fill="#164044" stroke="#36baaa" stroke-width="2"/><text x="548" y="307" fill="#9bf2d5" font-size="20">02 / GENERATE</text><text x="548" y="349" fill="white" font-size="25" font-weight="700">Render audio</text><text x="548" y="385" fill="#b6ddcd" font-size="18">Same voices · settings</text>
<rect x="754" y="260" width="280" height="161" rx="22" fill="#292a4b" stroke="#8b8dde" stroke-width="2"/><text x="894" y="307" fill="#b2b1ff" font-size="20">03 / INTELLIGIBILITY</text><text x="894" y="349" fill="white" font-size="25" font-weight="700">ASR · WER · CER</text><text x="894" y="385" fill="#c9c5e6" font-size="18">Match spoken to written</text>
<rect x="1102" y="260" width="270" height="161" rx="22" fill="#493923" stroke="#d7a968" stroke-width="2"/><text x="1237" y="307" fill="#ffe0a0" font-size="20">04 / DELIVERY</text><text x="1237" y="349" fill="white" font-size="25" font-weight="700">TTFA · RTFx</text><text x="1237" y="385" fill="#dbc9ab" font-size="18">Latency · throughput</text>
<path d="M342 339 H402 M686 339 H746 M1035 339 H1094" stroke="#8fd3ea" stroke-width="4" fill="none" marker-end="url(#arr)"/>
<rect x="70" y="516" width="401" height="171" rx="22" fill="#153449" stroke="#488fc7" stroke-width="2"/><text x="270" y="562" fill="#8dd4ff" font-size="20">05 / HUMAN LISTENING</text><text x="270" y="609" fill="#f1f9ff" font-size="26" font-weight="700">Expression · accent · bias</text><text x="270" y="646" fill="#b3cede" font-size="19">Blind, matched-volume tests</text>
<rect x="520" y="516" width="402" height="171" rx="22" fill="#16403b" stroke="#46bfb3" stroke-width="2"/><text x="720" y="562" fill="#a2f8d4" font-size="20">06 / OPERATING COST</text><text x="720" y="609" fill="#f1f9ff" font-size="26" font-weight="700">Audio + text tokens</text><text x="720" y="646" fill="#b1d5c9" font-size="19">Failed jobs · retries · egress</text>
<rect x="970" y="516" width="402" height="171" rx="22" fill="#282a49" stroke="#898ee2" stroke-width="2"/><text x="1171" y="562" fill="#b4b7ff" font-size="20">07 / SELECT</text><text x="1171" y="609" fill="#f1f9ff" font-size="26" font-weight="700">Quality × cost × latency</text><text x="1171" y="646" fill="#c2c7e8" font-size="19">Report uncertainty and limits</text>
</g><text x="76" y="765" fill="#9db7c7" font-size="19" font-family="Arial,Helvetica,sans-serif">WER and CER do not measure expressiveness; a speaker-similarity score is not a substitute for listening.</text></svg>