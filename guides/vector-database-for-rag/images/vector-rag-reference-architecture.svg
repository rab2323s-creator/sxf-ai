<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="RAG infrastructure: two pipelines"><rect width="1600" height="900" fill="#09131a"/><text x="72" y="90" font-family="Arial" font-size="26" font-weight="700" fill="#c8ff4d">SXF / AI · ORIGINAL REFERENCE</text><text x="72" y="166" font-family="Arial" font-size="45" font-weight="700" fill="#f3f9f2">RAG infrastructure: two pipelines</text><text x="72" y="216" font-family="Arial" font-size="25" fill="#adc5bc">Policy, provenance and versioning connect ingestion to answers</text><rect x="72" y="290" width="460" height="170" rx="21" fill="#152a25" stroke="#739a75" stroke-width="2"/><text x="96" y="344" fill="#c8ff4d" font-family="Arial" font-size="20">01 · INGEST</text><text x="96" y="398" fill="#eff8ef" font-family="Arial" font-size="30" font-weight="700">Documents + ACL</text><text x="96" y="433" fill="#b4c9c0" font-family="Arial" font-size="19">Stable IDs, source revisions</text><rect x="566" y="290" width="460" height="170" rx="21" fill="#152a25" stroke="#739a75" stroke-width="2"/><text x="590" y="344" fill="#c8ff4d" font-family="Arial" font-size="20">02 · TRANSFORM</text><text x="590" y="398" fill="#eff8ef" font-family="Arial" font-size="30" font-weight="700">Chunks + embeddings</text><text x="590" y="433" fill="#b4c9c0" font-family="Arial" font-size="19">Model and metric versions</text><rect x="1060" y="290" width="460" height="170" rx="21" fill="#152a25" stroke="#739a75" stroke-width="2"/><text x="1084" y="344" fill="#c8ff4d" font-family="Arial" font-size="20">03 · INDEX</text><text x="1084" y="398" fill="#eff8ef" font-family="Arial" font-size="30" font-weight="700">Vector and text index</text><text x="1084" y="433" fill="#b4c9c0" font-family="Arial" font-size="19">Metadata, filters, freshness</text><rect x="72" y="500" width="460" height="170" rx="21" fill="#152a25" stroke="#739a75" stroke-width="2"/><text x="96" y="554" fill="#c8ff4d" font-family="Arial" font-size="20">04 · QUERY</text><text x="96" y="608" fill="#eff8ef" font-family="Arial" font-size="30" font-weight="700">Trusted identity</text><text x="96" y="643" fill="#b4c9c0" font-family="Arial" font-size="19">Tenant + document access</text><rect x="566" y="500" width="460" height="170" rx="21" fill="#152a25" stroke="#739a75" stroke-width="2"/><text x="590" y="554" fill="#c8ff4d" font-family="Arial" font-size="20">05 · RETRIEVE</text><text x="590" y="608" fill="#eff8ef" font-family="Arial" font-size="30" font-weight="700">Dense + lexical</text><text x="590" y="643" fill="#b4c9c0" font-family="Arial" font-size="19">Filter before selecting context</text><rect x="1060" y="500" width="460" height="170" rx="21" fill="#152a25" stroke="#739a75" stroke-width="2"/><text x="1084" y="554" fill="#c8ff4d" font-family="Arial" font-size="20">06 · GENERATE</text><text x="1084" y="608" fill="#eff8ef" font-family="Arial" font-size="30" font-weight="700">Cite or abstain</text><text x="1084" y="643" fill="#b4c9c0" font-family="Arial" font-size="19">Evaluate answer evidence</text><text x="75" y="836" fill="#adcaac" font-family="Arial" font-size="21">Reference architecture, not a certified vendor deployment.</text></svg>