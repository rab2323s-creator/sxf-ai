<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">LLM quantization: FP16 vs 8-bit vs 4-bit model weight storage</title><desc id="d">Original SXF infographic with three weight compression rows showing relative theoretical capacity, the separate KV cache, and the balance of size, precision and quality.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142426"/><stop offset="1" stop-color="#080c12"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g opacity=".45" stroke="#213c3c"><path d="M0 175H1600M0 350H1600M0 525H1600M0 700H1600"/><path d="M200 0V900M500 0V900M800 0V900M1100 0V900M1400 0V900"/></g><g font-family="Arial,sans-serif"><text x="85" y="90" fill="#c8ff4d" font-size="21" font-weight="bold" letter-spacing="4">SXF / AI · PRECISION ENGINEERING</text><text x="85" y="158" fill="#f0f8f8" font-size="60" font-weight="bold">What changes when you quantize an LLM?</text><text x="85" y="210" fill="#a5b8bd" font-size="25">Lower weight precision saves memory. It does not shrink every runtime allocation.</text><rect x="87" y="292" width="1430" height="127" rx="22" fill="#1c2830" stroke="#55707d" stroke-width="2"/><text x="117" y="344" fill="#d3eaff" font-size="29" font-weight="bold">FP16</text><text x="118" y="384" fill="#9bb6c9" font-size="20">16 bits / weight</text><g fill="#8da5c7"><rect x="415" y="325" width="54" height="62" rx="9"/><rect x="479" y="325" width="54" height="62" rx="9"/><rect x="543" y="325" width="54" height="62" rx="9"/><rect x="607" y="325" width="54" height="62" rx="9"/><rect x="671" y="325" width="54" height="62" rx="9"/><rect x="735" y="325" width="54" height="62" rx="9"/><rect x="799" y="325" width="54" height="62" rx="9"/><rect x="863" y="325" width="54" height="62" rx="9"/><rect x="927" y="325" width="54" height="62" rx="9"/><rect x="991" y="325" width="54" height="62" rx="9"/><rect x="1055" y="325" width="54" height="62" rx="9"/><rect x="1119" y="325" width="54" height="62" rx="9"/><rect x="1183" y="325" width="54" height="62" rx="9"/><rect x="1247" y="325" width="54" height="62" rx="9"/><rect x="1311" y="325" width="54" height="62" rx="9"/><rect x="1375" y="325" width="54" height="62" rx="9"/></g><rect x="87" y="449" width="1430" height="127" rx="22" fill="#1c2930" stroke="#477c7d" stroke-width="2"/><text x="117" y="501" fill="#aaf2e5" font-size="29" font-weight="bold">INT8</text><text x="118" y="541" fill="#9bb6c9" font-size="20">~8 bits + metadata</text><g fill="#64bbaa"><rect x="415" y="482" width="54" height="62" rx="9"/><rect x="479" y="482" width="54" height="62" rx="9"/><rect x="543" y="482" width="54" height="62" rx="9"/><rect x="607" y="482" width="54" height="62" rx="9"/><rect x="671" y="482" width="54" height="62" rx="9"/><rect x="735" y="482" width="54" height="62" rx="9"/><rect x="799" y="482" width="54" height="62" rx="9"/><rect x="863" y="482" width="54" height="62" rx="9"/></g><rect x="87" y="606" width="1430" height="127" rx="22" fill="#1b3125" stroke="#79d3a6" stroke-width="2"/><text x="117" y="659" fill="#c8ff4d" font-size="29" font-weight="bold">INT4</text><text x="118" y="699" fill="#a1c4b0" font-size="20">~4 bits + metadata</text><g fill="#c8ff4d"><rect x="415" y="638" width="54" height="62" rx="9"/><rect x="479" y="638" width="54" height="62" rx="9"/><rect x="543" y="638" width="54" height="62" rx="9"/><rect x="607" y="638" width="54" height="62" rx="9"/></g><path d="M1420 350V697" stroke="#b3c5bc" stroke-width="3" stroke-dasharray="8 8"/><rect x="1135" y="783" width="382" height="64" rx="14" fill="#25382e" stroke="#8dc4a4"/><text x="1326" y="810" text-anchor="middle" fill="#e0f6e7" font-size="22" font-weight="bold">KV cache remains separate</text><text x="1326" y="834" text-anchor="middle" fill="#a9cabb" font-size="16">Context × heads × layers × batch</text><text x="86" y="840" fill="#a7b9bc" font-size="20">Illustrative bit-width ratios 