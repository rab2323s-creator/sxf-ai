<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">LLM VRAM budgeting: weights, KV cache and overhead</title><desc id="d">Original SXF diagram showing VRAM allocations for quantized model weights, context-dependent KV cache, activations and runtime buffers with numeric example for Llama 3.1 8B architecture.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102120"/><stop offset="1" stop-color="#091018"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="83" y="93" fill="#c8ff4d" font-size="21" font-weight="bold" letter-spacing="4">SXF / AI · HARDWARE PLANNING</text><text x="83" y="161" fill="#f4fbf8" font-size="59" font-weight="bold">VRAM is more than model weights.</text><text x="83" y="213" fill="#a3bec0" font-size="25">An 8B-model example · Q4_K_M · 4K tokens · FP16 KV · one sequence</text><rect x="85" y="287" width="1430" height="198" rx="25" fill="#111f27" stroke="#37604f" stroke-width="3"/><text x="115" y="333" fill="#deeae8" font-size="27" font-weight="bold">Budget components</text><rect x="119" y="355" width="851" height="93" rx="15" fill="#b8f75e"/><text x="545" y="407" text-anchor="middle" fill="#172916" font-size="30" font-weight="bold">WEIGHTS · illustrative Q4_K_M</text><rect x="989" y="355" width="120" height="93" rx="13" fill="#6ed4be"/><text x="1049" y="398" text-anchor="middle" fill="#0d2524" font-size="22" font-weight="bold">KV</text><text x="1049" y="426" text-anchor="middle" fill="#0d2524" font-size="19">0.50</text><rect x="1128" y="355" width="352" height="93" rx="13" fill="#567089"/><text x="1304" y="394" text-anchor="middle" fill="#edf5ff" font-size="23" font-weight="bold">RUNTIME HEADROOM</text><text x="1304" y="425" text-anchor="middle" fill="#d0dce8" font-size="19">Model / workload-specific</text><path d="M200 485V553M1051 485V553M1328 485V553" stroke="#79edc1" stroke-width="4"/><rect x="86" y="563" width="417" height="143" rx="20" fill="#1e392a" stroke="#a9ec8a" stroke-width="2"/><text x="119" y="608" fill="#d7fda7" font-size="25" font-weight="bold">Weights</text><text x="119" y="647" fill="#eef9f0" font-size="22">Parameters × effective bpw ÷ 8</text><text x="119" y="679" fill="#aac4b7" font-size="18">GGUF block overhead is real.</text><rect x="584" y="563" width="417" height="143" rx="20" fill="#1b3639" stroke="#6dd6c7" stroke-width="2"/><text x="616" y="608" fill="#91f3df" font-size="25" font-weight="bold">KV cache</text><text x="616" y="647" fill="#eef9f0" font-size="20">2 × layers × KV heads</text><text x="616" y="678" fill="#b1d7d4" font-size="19">× head dim × tokens × bytes</text><rect x="1080" y="563" width="435" height="143" rx="20" fill="#1b2839" stroke="#7595b5" stroke-width="2"/><text x="1112" y="608" fill="#bad5fa" font-size="25" font-weight="bold">Overhead + margin</text><text x="1112" y="646" fill="#eef9f0" font-size="19">Buffers, activations, fragmentation</text><text x="1112" y="679" fill="#b7cce1" font-size="19">Measure on your exact runtime.</text><text x="88" y="800" fill="#c8ff4d" font-size="25" font-weight="bold">4-bit weights do not imply 4-bit KV cache.</text><text x="88" y="840" fill="#8ca9a9" font-size="18">Example KV estimate assumes 32 layers, 8 KV heads, 128 head dimension, 4096 tokens, FP16, batch = 1.</text></g></svg>