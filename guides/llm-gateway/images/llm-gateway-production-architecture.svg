<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Production LLM Gateway Architecture"><rect width="1600" height="900" fill="#08121b"/><g font-family="Arial,sans-serif"><text x="62" y="80" fill="#c8ff4d" font-size="25" font-weight="700">SXF / AI · ORIGINAL TECHNICAL DIAGRAM</text><text x="62" y="155" fill="#f5f9f2" font-size="50" font-weight="800">Production LLM Gateway Architecture</text><text x="62" y="205" fill="#afc3be" font-size="25">Application to policy to router to model providers</text><rect x="62" y="285" width="476" height="172" rx="21" fill="#162b23" stroke="#80a17e"/><text x="84" y="331" fill="#c8ff4d" font-size="22">APP</text><text x="84" y="385" fill="#f4faf1" font-size="30" font-weight="700">Authenticated intake</text><text x="84" y="429" fill="#b7cec2" font-size="22">Tenant + request scope</text><rect x="572" y="285" width="476" height="172" rx="21" fill="#162b23" stroke="#80a17e"/><text x="594" y="331" fill="#c8ff4d" font-size="22">POLICY</text><text x="594" y="385" fill="#f4faf1" font-size="30" font-weight="700">Quotas and budgets</text><text x="594" y="429" fill="#b7cec2" font-size="22">RPM/TPM, spend, ACL</text><rect x="1082" y="285" width="476" height="172" rx="21" fill="#162b23" stroke="#80a17e"/><text x="1104" y="331" fill="#c8ff4d" font-size="22">ROUTER</text><text x="1104" y="385" fill="#f4faf1" font-size="30" font-weight="700">Capability decision</text><text x="1104" y="429" fill="#b7cec2" font-size="22">Pinned model and schema</text><rect x="62" y="508" width="476" height="172" rx="21" fill="#162b23" stroke="#80a17e"/><text x="84" y="554" fill="#c8ff4d" font-size="22">PRIMARY</text><text x="84" y="608" fill="#f4faf1" font-size="30" font-weight="700">Provider A</text><text x="84" y="652" fill="#b7cec2" font-size="22">Credentials separated</text><rect x="572" y="508" width="476" height="172" rx="21" fill="#162b23" stroke="#80a17e"/><text x="594" y="554" fill="#c8ff4d" font-size="22">FALLBACK</text><text x="594" y="608" fill="#f4faf1" font-size="30" font-weight="700">Provider B</text><text x="594" y="652" fill="#b7cec2" font-size="22">Pre-stream contract</text><rect x="1082" y="508" width="476" height="172" rx="21" fill="#162b23" stroke="#80a17e"/><text x="1104" y="554" fill="#c8ff4d" font-size="22">OBSERVE</text><text x="1104" y="608" fill="#f4faf1" font-size="30" font-weight="700">Redacted telemetry</text><text x="1104" y="652" fill="#b7cec2" font-size="22">Usage, latency, errors</text><text x="62" y="839" fill="#a9bfae" font-size="22">Design pattern. Verify rate limits, stream behavior, security and capability parity.</text></g></svg>