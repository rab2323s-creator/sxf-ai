<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="ttl desc"><title id="ttl">Recursive self-improvement loop and evidence gates</title><desc id="desc">Five-stage proposed feedback loop: research agent, proposed upgrade, experiment, independent verification and successor. At each stage there may be bottlenecks and the loop is not proof of an intelligence explosion.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071327"/><stop offset="1" stop-color="#162f45"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#58cbff"/><stop offset="1" stop-color="#89f1d1"/></linearGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#b6d6eb" opacity=".10"/></pattern><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L11 6L0 12" fill="none" stroke="#8fdbe9" stroke-width="2"/></marker></defs><rect width="1600" height="900" fill="url(#b)"/><rect width="1600" height="900" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif"><text x="80" y="94" fill="#9fbfd7" font-size="26" letter-spacing="4">HOW A SELF-IMPROVEMENT LOOP WOULD WORK</text><text x="80" y="167" fill="#f6fbff" font-weight="700" font-size="52">Better research tools can make better research tools.</text><text x="80" y="216" fill="#a5c5da" font-size="25">A validated feedback loop is not automatically runaway growth.</text>
<g stroke="#4788b1" stroke-width="2"><rect x="70" y="296" width="275" height="243" rx="25" fill="#102b46"/><rect x="365" y="296" width="275" height="243" rx="25" fill="#133247"/><rect x="660" y="296" width="275" height="243" rx="25" fill="#123e40" stroke="#31a8a1"/><rect x="955" y="296" width="275" height="243" rx="25" fill="#1e3650"/><rect x="1250" y="296" width="280" height="243" rx="25" fill="#173b3b" stroke="#52c1aa"/></g>
<g font-size="22" font-weight="700"><text x="100" y="345" fill="#8fd6ff">01 / RESEARCH</text><text x="395" y="345" fill="#8fd6ff">02 / PROPOSE</text><text x="690" y="345" fill="#92f5d6">03 / EXPERIMENT</text><text x="985" y="345" fill="#a8d7ff">04 / VERIFY</text><text x="1280" y="345" fill="#95f2ca">05 / REUSE</text></g>
<g font-size="29" fill="#f3f9ff" font-weight="700"><text x="100" y="407">AI research</text><text x="100" y="444">assistant</text><text x="395" y="407">Improvement</text><text x="395" y="444">hypothesis</text><text x="690" y="407">Train or test</text><text x="690" y="444">candidate</text><text x="985" y="407">Independent</text><text x="985" y="444">evaluation</text><text x="1280" y="407">Deploy better</text><text x="1280" y="444">researcher</text></g>
<g font-size="19" fill="#bbd1de"><text x="100" y="499">Finds bottlenecks</text><text x="395" y="499">Designs a change</text><text x="690" y="499">Controlled trial</text><text x="985" y="499">Held-out tasks</text><text x="1280" y="499">Only if gains persist</text></g>
<g fill="none" stroke="#86d5e7" stroke-width="4" marker-end="url(#arr)"><path d="M347 419H359"/><path d="M642 419H654"/><path d="M937 419H949"/><path d="M1232 419H1244"/></g><path d="M1390 548V605H206V548" fill="none" stroke="#71d5c3" stroke-width="4" stroke-dasharray="12 9"/><text x="773" y="587" fill="#a1f2de" font-size="23" font-weight="700" text-anchor="middle">Only a successful successor can close the next loop</text>
<rect x="80" y="664" width="1440" height="144" rx="24" fill="#101f35" stroke="#395f78" stroke-width="2"/><text x="113" y="714" fill="#f4f8ff" font-size="25" font-weight="700">The friction points</text><g font-size="22" fill="#c3d6e5"><text x="116" y="765">Compute &amp; experiments</text><text x="405" y="765">Validation errors</text><text x="676" y="765">Data &amp; novelty</text><text x="935" y="765">Generation time</text><text x="1231" y="765">Safety &amp; oversight</text></g><text x="80" y="861" fill="#91afc2" font-size="20">SXF / AI research illustration · Conceptual workflow, not evidence of autonomous superintelligence</text></g></svg>