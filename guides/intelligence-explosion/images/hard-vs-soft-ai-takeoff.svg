<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="ttl desc"><title id="ttl">Hard takeoff versus soft takeoff and bounded progress</title><desc id="desc">Conceptual comparison chart of three possible trajectories for AI capability over time: rapid takeoff, gradual takeoff and slowing progress, with uncertainty rather than actual forecasts.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081428"/><stop offset="1" stop-color="#162d40"/></linearGradient><pattern id="g" width="95" height="65" patternUnits="userSpaceOnUse"><path d="M0 0H95M0 0V65" fill="none" stroke="#bcd5e3" stroke-opacity=".1"/></pattern><linearGradient id="fast" x2="0" y2="1"><stop stop-color="#d4a5ff" stop-opacity=".32"/><stop offset="1" stop-color="#d4a5ff" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="78" y="88" fill="#9cbcd1" font-size="24" letter-spacing="4">THREE POSSIBLE AI TAKEOFF SHAPES</text><text x="78" y="155" fill="#fff" font-size="51" font-weight="700">Speed of improvement is the unresolved question.</text><text x="78" y="199" fill="#a9c7d9" font-size="24">Conceptual scenarios · Not measured data and not predicted timelines</text></g>
<rect x="145" y="270" width="1060" height="480" fill="url(#g)"/><g stroke="#93bbce" stroke-width="3" fill="none"><path d="M145 245V750H1235"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#bdd4e5" font-size="23"><text x="58" y="525" transform="rotate(-90 58 525)">Relative system capability</text><text x="630" y="802">Elapsed time (not to scale)</text><text x="123" y="765" font-size="17">0</text><text x="150" y="239" font-size="17">Higher</text><text x="1156" y="778" font-size="17">Later</text></g>
<path d="M170 717C355 712 500 689 642 635S882 498 955 398S1029 293 1045 278" fill="none" stroke="#d1a3ff" stroke-width="7" stroke-linecap="round"/><path d="M170 717C390 693 575 641 721 590S992 494 1165 381" fill="none" stroke="#65b9ff" stroke-width="7" stroke-linecap="round"/><path d="M170 717C385 684 528 653 690 624S1001 596 1165 593" fill="none" stroke="#66e1b9" stroke-width="7" stroke-linecap="round"/><path d="M955 398Q1014 304 1050 255L1050 278Q1014 330 955 398" fill="url(#fast)"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700"><text x="1080" y="296" fill="#e1c6ff">Hard / rapid takeoff</text><text x="1188" y="385" fill="#91c9ff" text-anchor="end">Soft / gradual takeoff</text><text x="1190" y="575" fill="#9bedce" text-anchor="end">Bounded or slowing</text></g>
<rect x="1250" y="308" width="295" height="380" rx="22" fill="#132b3f" stroke="#426a85" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="1276" y="359" fill="#f1f8ff" font-size="26" font-weight="700">What changes the path?</text><g font-size="21" fill="#c2d6e4"><text x="1276" y="413">• Feedback strength</text><text x="1276" y="469">• Time per iteration</text><text x="1276" y="525">• Compute and energy</text><text x="1276" y="581">• Experiments and data</text><text x="1276" y="637">• Reliability and controls</text></g><text x="78" y="858" fill="#92aec1" font-size="21">SXF / AI · Illustrative trajectories only; no evidence establishes the shape or arrival time of future ASI.</text></g></svg>