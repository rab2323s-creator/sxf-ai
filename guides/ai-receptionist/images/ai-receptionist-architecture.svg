<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="ttl desc"><title id="ttl">AI receptionist voice agent architecture</title><desc id="desc">Call flows from customer phone via carrier to voice agent, then permission checks to calendar or CRM, verified booking response, with human transfer and privacy monitoring.</desc><rect width="1200" height="620" fill="#0b1724"/><text x="64" y="68" fill="#e3f4ff" font-family="Arial,sans-serif" font-weight="bold" font-size="31">AI receptionist: a safe phone-to-booking architecture</text><text x="64" y="105" fill="#a5c3d7" font-family="Arial,sans-serif" font-size="17">Verified workflow — no booking is promised before the calendar confirms it</text><g font-family="Arial,sans-serif" font-size="21"><rect x="48" y="157" width="210" height="126" rx="18" fill="#1b3a50" stroke="#76c1dd" stroke-width="2"/><text x="153" y="206" text-anchor="middle" fill="#f2faff">Caller</text><text x="153" y="240" text-anchor="middle" fill="#cce6f3" font-size="17">Phone / PSTN</text><rect x="350" y="157" width="210" height="126" rx="18" fill="#1b3a50" stroke="#76c1dd" stroke-width="2"/><text x="455" y="205" text-anchor="middle" fill="#f2faff">Phone carrier</text><text x="455" y="240" text-anchor="middle" fill="#cce6f3" font-size="17">SIP / routing</text><rect x="652" y="157" width="230" height="126" rx="18" fill="#1b3a50" stroke="#76c1dd" stroke-width="2"/><text x="767" y="203" text-anchor="middle" fill="#f2faff">Voice AI agent</text><text x="767" y="238" text-anchor="middle" fill="#cce6f3" font-size="17">VAD / speech / tools</text><rect x="964" y="157" width="184" height="126" rx="18" fill="#314a3c" stroke="#92d9aa" stroke-width="2"/><text x="1056" y="205" text-anchor="middle" fill="#f0fff5">Authorization</text><text x="1056" y="239" text-anchor="middle" fill="#d8ffe5" font-size="16">Scope + policy</text></g><g fill="none" stroke="#9bd7ec" stroke-width="4" stroke-linecap="round"><path d="M260 220H346"/><path d="M562 220H648"/><path d="M884 220H960"/></g><g fill="#9bd7ec"><path d="M346 220l-14 -8v16z"/><path d="M648 220l-14 -8v16z"/><path d="M960 220l-14 -8v16z"/></g><path d="M1056 286V348H860V390" fill="none" stroke="#9eddb4" stroke-width="4"/><path d="M860 390l-9 -15h18z" fill="#9eddb4"/><rect x="748" y="391" width="350" height="110" rx="16" fill="#244737" stroke="#91d3a5" stroke-width="2"/><text x="923" y="436" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#eafff0">Calendar / CRM</text><text x="923" y="472" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#d0f6dd">Check slot → write → confirm</text><path d="M765 287V344H457V390" fill="none" stroke="#d2ac73" stroke-width="4"/><path d="M457 390l-9 -15h18z" fill="#d2ac73"/><rect x="294" y="391" width="320" height="110" rx="16" fill="#4b392a" stroke="#efc08d" stroke-width="2"/><text x="454" y="438" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#fff0de">Human transfer</text><text x="454" y="472" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#ffe4c4">Staff / fallback / emergency</text><rect x="65" y="551" width="1080" height="42" rx="10" fill="#122b3b"/><text x="605" y="577" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#cae4f2">Across every step: privacy notice · least privilege · monitoring · rollback · retention policy</text></svg>