<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">SXF AI leaderboard evidence passport</title><desc id="d">Compare evaluation platforms only after matching measured task, score type, benchmark release, model configuration, date and uncertainty. Artificial Analysis, Arena and LiveBench answer different questions.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14231c"/><stop offset="1" stop-color="#080d0a"/></linearGradient></defs><rect width="1200" height="675" fill="#070b09"/><rect x="26" y="26" width="1148" height="622" rx="23" fill="url(#bg)" stroke="#36523e" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="72" y="87" fill="#c8ff4d" font-size="22" letter-spacing="3">SXF / ORIGINAL EVIDENCE PASSPORT</text><text x="72" y="149" fill="#f1f9ee" font-size="41" font-weight="bold">One rank is not one definition of “best”.</text><rect x="70" y="205" width="334" height="212" rx="16" fill="#16271b" stroke="#4f7155" stroke-width="2"/><text x="96" y="250" fill="#c8ff4d" font-size="18">ARTIFICIAL ANALYSIS</text><text x="96" y="295" fill="#fff" font-weight="bold" font-size="26">Weighted capability</text><text x="96" y="329" fill="#fff" font-weight="bold" font-size="26">index + cost</text><text x="96" y="380" fill="#a8bbac" font-size="17">AA Index v5.0.1 · 9 tests</text><rect x="433" y="205" width="334" height="212" rx="16" fill="#16271b" stroke="#4f7155" stroke-width="2"/><text x="459" y="250" fill="#c8ff4d" font-size="18">ARENA / LMARENA</text><text x="459" y="295" fill="#fff" font-weight="bold" font-size="26">Human preference</text><text x="459" y="329" fill="#fff" font-weight="bold" font-size="26">+ uncertainty</text><text x="459" y="380" fill="#a8bbac" font-size="17">Bradley-Terry · rank spread</text><rect x="796" y="205" width="334" height="212" rx="16" fill="#16271b" stroke="#4f7155" stroke-width="2"/><text x="822" y="250" fill="#c8ff4d" font-size="18">LIVEBENCH 2.0</text><text x="822" y="295" fill="#fff" font-weight="bold" font-size="26">Long-horizon</text><text x="822" y="329" fill="#fff" font-weight="bold" font-size="26">task outcomes</text><text x="822" y="380" fill="#a8bbac" font-size="17">Suites · cost per success</text><rect x="174" y="475" width="852" height="111" rx="17" fill="#1a351d" stroke="#c8ff4d" stroke-width="2"/><text x="600" y="519" text-anchor="middle" fill="#c8ff4d" font-size="23" font-weight="bold">COMPARE THE EVIDENCE CONTRACT, NOT RAW NUMBERS</text><text x="600" y="556" text-anchor="middle" fill="#e0ecdd" font-size="18">Task · unit · version · model settings · snapshot · uncertainty</text></g></svg>