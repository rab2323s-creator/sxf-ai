<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">SXF original local workstation capacity selection map</title><desc id="d">Step 1: confirm total weights plus context fit an assumed allocatable memory pool. Step 2: compare measured prefill and generation performance in identical tests. Step 3: evaluate vendor-specific runtime support and real price. No manufacturer rank based on marketing TOPS.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14231b"/><stop offset="1" stop-color="#080e0a"/></linearGradient></defs><rect width="1200" height="675" fill="#070c09"/><rect x="26" y="25" width="1148" height="625" rx="22" fill="url(#bg)" stroke="#36533d" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="75" y="82" fill="#c8ff4d" font-size="22" letter-spacing="3">SXF / LOCAL AI WORKSTATION LAB</text><text x="75" y="143" fill="#f2faef" font-size="39" font-weight="bold">Fit the weights. Measure the workload. Then buy.</text><rect x="74" y="203" width="326" height="215" rx="16" fill="#152519" stroke="#557955" stroke-width="2"/><text x="100" y="249" fill="#c8ff4d" font-size="18">01 · CAPACITY SCREEN</text><text x="100" y="293" fill="#f2faf0" font-size="25" font-weight="bold">Total weights + context</text><text x="100" y="326" fill="#f2faf0" font-size="25" font-weight="bold">≤ allocatable memory?</text><text x="100" y="382" fill="#a6b7a9" font-size="17">Compute; clearly label assumptions</text><rect x="437" y="203" width="326" height="215" rx="16" fill="#152519" stroke="#557955" stroke-width="2"/><text x="463" y="249" fill="#c8ff4d" font-size="18">02 · MEASURE REAL SPEED</text><text x="463" y="293" fill="#f2faf0" font-size="25" font-weight="bold">Prefill, time to first</text><text x="463" y="326" fill="#f2faf0" font-size="25" font-weight="bold">token, output tokens/s</text><text x="463" y="382" fill="#a6b7a9" font-size="17">Same model, backend and context</text><rect x="800" y="203" width="326" height="215" rx="16" fill="#152519" stroke="#557955" stroke-width="2"/><text x="826" y="249" fill="#c8ff4d" font-size="18">03 · VERIFY DEPLOYMENT</text><text x="826" y="293" fill="#f2faf0" font-size="25" font-weight="bold">Driver, runtime, policy</text><text x="826" y="326" fill="#f2faf0" font-size="25" font-weight="bold">and configured price</text><text x="826" y="382" fill="#a6b7a9" font-size="17">NVIDIA / Apple / AMD specifics</text><g fill="none" stroke="#c8ff4d" stroke-width="4"><path d="M402 307h33m-14-10 14 10-14 10M765 307h33m-14-10 14 10-14 10"/></g><rect x="247" y="475" width="706" height="112" rx="17" fill="#19351e" stroke="#c8ff4d" stroke-width="2"/><text x="600" y="518" fill="#c8ff4d" font-size="23" text-anchor="middle" font-weight="bold">CAPACITY IS NOT A PERFORMANCE BENCHMARK</text><text x="600" y="555" fill="#d3e9d1" font-size="19" text-anchor="middle">Use evidence from the exact configuration you intend to buy.</text></g></svg>