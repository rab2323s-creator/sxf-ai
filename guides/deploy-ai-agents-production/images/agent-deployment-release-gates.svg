<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">SXF release gates for deploying agents</title><desc id="d">Versioned builds flow through quality checks, fault injection, canary, monitoring, promotion and rollback.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a111a"/><stop offset="1" stop-color="#101f1a"/></linearGradient><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1 1L10 5L1 10" stroke="#c8ff4d" stroke-width="2" fill="none"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="72" y="85" fill="#c8ff4d" font-size="25" letter-spacing="4" font-weight="700">SXF / AI · RELEASE ENGINEERING</text><text x="72" y="153" fill="#f6faf6" font-size="49" font-weight="800">Production deployment is a sequence of evidence gates</text><text x="72" y="194" fill="#a8b9b5" font-size="23">The rollback plan is written before the canary receives production traffic.</text>
<g fill="#14251e" stroke="#668d73" stroke-width="2"><rect x="73" y="289" rx="23" width="254" height="172"/><rect x="370" y="289" rx="23" width="254" height="172"/><rect x="667" y="289" rx="23" width="254" height="172"/><rect x="964" y="289" rx="23" width="254" height="172"/><rect x="1261" y="289" rx="23" width="254" height="172"/></g><g font-size="19" fill="#b6eb8c"><text x="98" y="336">01 BUILD</text><text x="395" y="336">02 VALIDATE</text><text x="692" y="336">03 REPLAY</text><text x="989" y="336">04 CANARY</text><text x="1286" y="336">05 DECIDE</text></g><g font-size="27" font-weight="700" fill="#f2f7f1"><text x="98" y="385">Immutable image</text><text x="395" y="385">Outcome tests</text><text x="692" y="385">Crash + retry</text><text x="989" y="385">Small traffic</text><text x="1286" y="385">Promote/abort</text></g><g fill="#9eb8ad" font-size="18"><text x="98" y="425">Code · schema · prompt</text><text x="395" y="425">Safety · auth · cost</text><text x="692" y="425">Idempotency · state</text><text x="989" y="425">Observe SLO deltas</text><text x="1286" y="425">Artifact + evidence</text></g><path d="M327 375H370 M624 375H667 M921 375H964 M1218 375H1261" stroke="#c8ff4d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="77" y="535" rx="20" width="684" height="196" fill="#132b32" stroke="#5c9cb3" stroke-width="2"/><text x="106" y="592" fill="#a0deff" font-size="24" font-weight="800">MEASURED GO SIGNAL</text><text x="106" y="638" fill="#f5f8f5" font-size="24">Accepted outcome · tail latency · safety</text><text x="106" y="680" fill="#f5f8f5" font-size="24">Queue age · duplicate effects · unit cost</text>
<rect x="835" y="535" rx="20" width="684" height="196" fill="#302020" stroke="#db877c" stroke-width="2"/><text x="864" y="592" fill="#ffc3b8" font-size="24" font-weight="800">ABORT AND RECONCILE</text><text x="864" y="638" fill="#f5e0d8" font-size="24">Route new work to prior pinned version</text><text x="864" y="680" fill="#f5e0d8" font-size="24">Resolve in-flight and irreversible actions</text>
