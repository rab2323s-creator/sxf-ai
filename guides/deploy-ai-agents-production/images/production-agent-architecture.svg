<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Production AI agent architecture</title><desc id="d">SXF original architecture: authenticated API, durable task store and queue, bounded workers, tool policy boundary and verification. Telemetry observes the full workflow.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09121b"/><stop offset="1" stop-color="#101d19"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#bdfa66" stroke-width="2"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="86" fill="#c8ff4d" font-family="Arial,sans-serif" font-weight="700" font-size="25" letter-spacing="4">SXF / AI · REFERENCE ARCHITECTURE</text><text x="75" y="147" fill="#f1f9f5" font-family="Arial,sans-serif" font-weight="800" font-size="47">Production agent: separate request, work and effect</text><text x="75" y="188" fill="#9cafb4" font-family="Arial,sans-serif" font-size="23">Recovery depends on persisted intent and verified effects—not a model reply.</text>
<g font-family="Arial,sans-serif"><rect x="70" y="255" rx="22" width="250" height="155" fill="#122b28" stroke="#6b9b7a" stroke-width="2"/><text x="95" y="307" fill="#c8ff4d" font-size="19">01 · ENTRY</text><text x="95" y="348" fill="#fff" font-size="27" font-weight="700">Authenticated API</text><text x="95" y="383" fill="#bad0c8" font-size="18">Auth · quotas · task ID</text>
<rect x="390" y="255" rx="22" width="280" height="155" fill="#162635" stroke="#5983ad" stroke-width="2"/><text x="415" y="307" fill="#83d6ff" font-size="19">02 · PERSIST</text><text x="415" y="348" fill="#fff" font-size="26" font-weight="700">Task DB + outbox</text><text x="415" y="383" fill="#bad0c8" font-size="18">Workflow source of truth</text>
<rect x="740" y="255" rx="22" width="280" height="155" fill="#1f3021" stroke="#7cba66" stroke-width="2"/><text x="765" y="307" fill="#c8ff4d" font-size="19">03 · DISPATCH</text><text x="765" y="348" fill="#fff" font-size="28" font-weight="700">Durable queue</text><text x="765" y="383" fill="#bad0c8" font-size="18">Leases · retry · dead letter</text>
<rect x="1090" y="255" rx="22" width="420" height="155" fill="#203026" stroke="#a0cc79" stroke-width="2"/><text x="1115" y="307" fill="#c8ff4d" font-size="19">04 · EXECUTE</text><text x="1115" y="348" fill="#fff" font-size="28" font-weight="700">Bounded agent workers</text><text x="1115" y="383" fill="#bad0c8" font-size="18">Model · checkpoints · tool budgets</text>
<path d="M320 333H390 M670 333H740 M1020 333H1090" fill="none" stroke="#bdfa66" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1090" y="488" rx="22" width="420" height="145" fill="#2c251d" stroke="#e8ad63" stroke-width="2"/><text x="1115" y="533" fill="#e8c18c" font-size="18">05 · ENFORCE</text><text x="1115" y="569" fill="#fff" font-size="27" font-weight="700">Policy + approval gate</text><text x="1115" y="603" fill="#e0c8aa" font-size="18">Least privilege · idempotency key</text>
<rect x="740" y="488" rx="22" width="280" height="145" fill="#272230" stroke="#b58ecb" stroke-width="2"/><text x="765" y="533" fill="#dcaff5" font-size="18">06 · EFFECT</text><text x="765" y="569" fill="#fff" font-size="26" font-weight="700">External tool / API</text><text x="765" y="603" fill="#c7b9d4" font-size="18">Verify downstream state</text>
<path d="M1305 410V488 M1090 560H1020" stroke="#bdfa66" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="488" rx="22" width="600" height="145" fill="#182630" stroke="#7899ac" stroke-width="2"/><text x="97" y="536" fill="#a6dafe" font-size="18">OBSERVE ALL BOUNDARIES</text><text x="97" y="577" fill="#fff" font-size="27" font-weight="700">Traces · accepted outcomes · SLOs</text><text x="97" y="608" fill="#a8bdc8" font-size="18">Task ID · unknown-effect reconciliation · cost</text>
<path d="M740 560H670" fill="none" stroke="#8acbe7" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<rect x="70" y="700" rx="20" width="1440" height="92" fill="#0e261b" stroke="#416c55"/><text x="99" y="739" fill="#d7ff9c" font-size="21" font-weight="700">RELEASE INVARIANT</text><text x="99" y="775" fill="#e7f4e9" font-size="23">Never report completion before a verified business outcome. Ambiguous remote effects require reconciliation.</text>
<text x="72" y="853" fill="#718b88" font-size="17">SXF / AI ORIGINAL SCHEMATIC · not a vendor-certified reference stack</text></g></svg>