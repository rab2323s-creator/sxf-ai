<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Cost per accepted outcome</title><desc id="desc">A low minute rate is not necessarily a low operating cost.</desc><rect width="960" height="540" rx="22" fill="#0a1217"/><rect x="25" y="25" width="910" height="490" rx="15" fill="#101c22" stroke="#344650"/><g font-family="Arial,sans-serif"><text x="55" y="64" fill="#c8ff4d" font-size="18" font-weight="bold">SXF / AI RESEARCH</text><text x="55" y="111" fill="#f0f5f8" font-size="31" font-weight="bold">Cost per accepted outcome</text><text x="55" y="145" fill="#aabac7" font-size="18">A low minute rate is not necessarily a low operating cost.</text><rect x="55" y="180" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="180" y="210" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Platform + models</text><text x="180" y="233" text-anchor="middle" fill="#aabac7" font-size="15">Usage and subscription</text><rect x="355" y="180" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="480" y="210" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Telephony + tools</text><text x="480" y="233" text-anchor="middle" fill="#aabac7" font-size="15">Carrier and integration</text><rect x="655" y="180" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="780" y="210" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Human operations</text><text x="780" y="233" text-anchor="middle" fill="#aabac7" font-size="15">Review and escalation</text><path d="M180 250 L420 310" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="420" cy="310" r="4" fill="#c8ff4d"/><path d="M480 250 L480 310" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="480" cy="310" r="4" fill="#c8ff4d"/><path d="M780 250 L540 310" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="540" cy="310" r="4" fill="#c8ff4d"/><rect x="305" y="310" width="350" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="480" y="340" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Total operating cost</text><text x="480" y="363" text-anchor="middle" fill="#aabac7" font-size="15">Divide by verified successful tasks</text><text x="55" y="435" fill="#aabac7" font-size="18">Include failed attempts, transfers and rework in the numerator.</text><text x="55" y="490" fill="#9cabb6" font-size="16">SXF original illustration · conceptual, not measured performance</text></g></svg>