<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Caller-perceived latency</title><desc id="desc">Start at caller speech end; stop at first audible agent response.</desc><rect width="960" height="540" rx="22" fill="#0a1217"/><rect x="25" y="25" width="910" height="490" rx="15" fill="#101c22" stroke="#344650"/><g font-family="Arial,sans-serif"><text x="55" y="64" fill="#c8ff4d" font-size="18" font-weight="bold">SXF / AI RESEARCH</text><text x="55" y="111" fill="#f0f5f8" font-size="31" font-weight="bold">Caller-perceived latency</text><text x="55" y="145" fill="#aabac7" font-size="18">Start at caller speech end; stop at first audible agent response.</text><rect x="55" y="220" width="170" height="78" rx="5" fill="#37516a"/><text x="140" y="265" text-anchor="middle" font-size="18" fill="white">Turn detection</text><rect x="230" y="220" width="150" height="78" rx="5" fill="#255b61"/><text x="305" y="265" text-anchor="middle" font-size="18" fill="white">Recognition</text><rect x="385" y="220" width="170" height="78" rx="5" fill="#46624b"/><text x="470" y="265" text-anchor="middle" font-size="18" fill="white">Reasoning</text><rect x="560" y="220" width="150" height="78" rx="5" fill="#66577a"/><text x="635" y="265" text-anchor="middle" font-size="18" fill="white">Synthesis</text><rect x="715" y="220" width="140" height="78" rx="5" fill="#6a593c"/><text x="785" y="265" text-anchor="middle" font-size="18" fill="white">Transport</text><path d="M55 330 V350 H855 V330" stroke="#c8ff4d" stroke-width="3" fill="none"/><text x="455" y="390" text-anchor="middle" font-size="24" fill="#c8ff4d">End-to-end audible response delay</text><text x="55" y="435" fill="#aabac7" font-size="18">Stages can overlap; block widths are schematic and not a timing budget.</text><text x="55" y="490" fill="#9cabb6" font-size="16">SXF original illustration · conceptual, not measured performance</text></g></svg>