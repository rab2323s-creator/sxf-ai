<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">SXF voice-agent acceptance protocol</title><desc id="desc">Planned experiment; no vendor tests have been completed by SXF.</desc><rect width="960" height="540" rx="22" fill="#0a1217"/><rect x="25" y="25" width="910" height="490" rx="15" fill="#101c22" stroke="#344650"/><g font-family="Arial,sans-serif"><text x="55" y="64" fill="#c8ff4d" font-size="18" font-weight="bold">SXF / AI RESEARCH</text><text x="55" y="111" fill="#f0f5f8" font-size="31" font-weight="bold">SXF voice-agent acceptance protocol</text><text x="55" y="145" fill="#aabac7" font-size="18">Planned experiment; no vendor tests have been completed by SXF.</text><rect x="55" y="190" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="180" y="220" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">16 cases</text><text x="180" y="243" text-anchor="middle" fill="#aabac7" font-size="15">Fixed scenario definitions</text><path d="M305 225 L355 225" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="355" cy="225" r="4" fill="#c8ff4d"/><rect x="355" y="190" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="480" y="220" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">3 repeats</text><text x="480" y="243" text-anchor="middle" fill="#aabac7" font-size="15">Per case / configuration</text><path d="M605 225 L655 225" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="655" cy="225" r="4" fill="#c8ff4d"/><rect x="655" y="190" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="780" y="220" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">48 trials</text><text x="780" y="243" text-anchor="middle" fill="#aabac7" font-size="15">Planned per configuration</text><rect x="55" y="320" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="180" y="350" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Evidence</text><text x="180" y="373" text-anchor="middle" fill="#aabac7" font-size="15">Recording + receipts</text><rect x="355" y="320" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="480" y="350" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Metrics</text><text x="480" y="373" text-anchor="middle" fill="#aabac7" font-size="15">Outcome + latency</text><rect x="655" y="320" width="250" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="780" y="350" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Critical gate</text><text x="780" y="373" text-anchor="middle" fill="#aabac7" font-size="15">Block unsafe failures</text><text x="55" y="435" fill="#aabac7" font-size="18">Never treat an unexecuted case or missing trace as a pass.</text><text x="55" y="490" fill="#9cabb6" font-size="16">SXF original illustration · conceptual, not measured performance</text></g></svg>