<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Two voice-agent architectures</title><desc id="desc">Compare orchestration layers, not just model brands.</desc><rect width="960" height="540" rx="22" fill="#0a1217"/><rect x="25" y="25" width="910" height="490" rx="15" fill="#101c22" stroke="#344650"/><g font-family="Arial,sans-serif"><text x="55" y="64" fill="#c8ff4d" font-size="18" font-weight="bold">SXF / AI RESEARCH</text><text x="55" y="111" fill="#f0f5f8" font-size="31" font-weight="bold">Two voice-agent architectures</text><text x="55" y="145" fill="#aabac7" font-size="18">Compare orchestration layers, not just model brands.</text><rect x="55" y="180" width="180" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="145" y="210" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Caller audio</text><text x="145" y="233" text-anchor="middle" fill="#aabac7" font-size="15">WebRTC / phone</text><path d="M235 215 L265 215" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="265" cy="215" r="4" fill="#c8ff4d"/><rect x="265" y="180" width="180" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="355" y="210" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">STT</text><text x="355" y="233" text-anchor="middle" fill="#aabac7" font-size="15">Recognition</text><path d="M445 215 L475 215" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="475" cy="215" r="4" fill="#c8ff4d"/><rect x="475" y="180" width="180" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="565" y="210" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">LLM</text><text x="565" y="233" text-anchor="middle" fill="#aabac7" font-size="15">Policy + tools</text><path d="M655 215 L685 215" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="685" cy="215" r="4" fill="#c8ff4d"/><rect x="685" y="180" width="220" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="795" y="210" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">TTS + audio</text><text x="795" y="233" text-anchor="middle" fill="#aabac7" font-size="15">Spoken reply</text><rect x="55" y="310" width="180" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="145" y="340" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Caller audio</text><text x="145" y="363" text-anchor="middle" fill="#aabac7" font-size="15">Streaming</text><path d="M235 345 L265 345" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="265" cy="345" r="4" fill="#c8ff4d"/><rect x="265" y="310" width="390" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="460" y="340" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Native realtime model</text><text x="460" y="363" text-anchor="middle" fill="#aabac7" font-size="15">Audio in · reasoning · audio out</text><path d="M655 345 L685 345" stroke="#c8ff4d" stroke-width="3" fill="none"/><circle cx="685" cy="345" r="4" fill="#c8ff4d"/><rect x="685" y="310" width="220" height="70" rx="10" fill="#14292b" stroke="#688c80"/><text x="795" y="340" text-anchor="middle" fill="#ecf7ee" font-size="21" font-weight="bold">Audio delivery</text><text x="795" y="363" text-anchor="middle" fill="#aabac7" font-size="15">Spoken reply</text><text x="55" y="435" fill="#c8ff4d" font-size="19">Both designs require permissions, tool verification and human fallback.</text><text x="55" y="490" fill="#9cabb6" font-size="16">SXF original illustration · conceptual, not measured performance</text></g></svg>