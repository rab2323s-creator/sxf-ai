<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Seven-step AI model selection framework</title><desc id="desc">Determine the task and hard constraints, shortlist eligible models, test with real cases, measure quality latency and cost, enforce privacy and safety gates, and select and monitor a model.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b20"/><stop offset="1" stop-color="#060b0f"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8ff4d"/><stop offset="1" stop-color="#79e8d3"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><g fill="none" stroke="#21313a" opacity=".55"><path d="M0 160H1600M0 340H1600M0 520H1600M0 700H1600"/><path d="M160 0V900M400 0V900M640 0V900M880 0V900M1120 0V900M1360 0V900"/></g><circle cx="1270" cy="130" r="230" fill="#c8ff4d" opacity=".06" filter="url(#glow)"/><text x="90" y="100" font-family="Arial,sans-serif" font-size="21" fill="#c8ff4d" font-weight="bold" letter-spacing="4">SXF / AI · MODEL DECISION ENGINEERING</text><text x="90" y="164" font-family="Arial,sans-serif" font-size="57" font-weight="bold" fill="#f2f7f9">Choose the model that passes your task.</text><text x="90" y="213" font-family="Arial,sans-serif" font-size="26" fill="#9eafba">A seven-stage framework — eligibility before optimization</text>
<g font-family="Arial,sans-serif">
<rect x="90" y="280" width="440" height="150" rx="23" fill="#102028" stroke="#3c6061" stroke-width="2"/><circle cx="141" cy="328" r="24" fill="#c8ff4d"/><text x="141" y="337" text-anchor="middle" font-weight="bold" font-size="25" fill="#14200b">1</text><text x="185" y="329" font-size="29" font-weight="bold" fill="#edf6f9">Define success</text><text x="120" y="379" font-size="21" fill="#9aafba">Task, rubric, accepted result</text>
<rect x="580" y="280" width="440" height="150" rx="23" fill="#102028" stroke="#3c6061" stroke-width="2"/><circle cx="631" cy="328" r="24" fill="#c8ff4d"/><text x="631" y="337" text-anchor="middle" font-weight="bold" font-size="25" fill="#14200b">2</text><text x="675" y="329" font-size="29" font-weight="bold" fill="#edf6f9">Hard constraints</text><text x="610" y="379" font-size="21" fill="#9aafba">Privacy, tools, context, license</text>
<rect x="1070" y="280" width="440" height="150" rx="23" fill="#102028" stroke="#3c6061" stroke-width="2"/><circle cx="1121" cy="328" r="24" fill="#c8ff4d"/><text x="1121" y="337" text-anchor="middle" font-weight="bold" font-size="25" fill="#14200b">3</text><text x="1165" y="329" font-size="29" font-weight="bold" fill="#edf6f9">Shortlist</text><text x="1100" y="379" font-size="21" fill="#9aafba">Only eligible candidates</text>
<path d="M530 355H578M1020 355H1068" stroke="#c8ff4d" stroke-width="5" stroke-linecap="round"/><path d="M568 344L578 355L568 366M1058 344L1068 355L1058 366" stroke="#c8ff4d" stroke-width="4" fill="none"/>
<rect x="90" y="505" width="440" height="150" rx="23" fill="#132128" stroke="#37545b" stroke-width="2"/><circle cx="141" cy="553" r="24" fill="#79e8d3"/><text x="141" y="562" text-anchor="middle" font-weight="bold" font-size="25" fill="#14200b">4</text><text x="185" y="554" font-size="27" font-weight="bold" fill="#edf6f9">Run task tests</text><text x="120" y="606" font-size="21" fill="#9aafba">Real cases, repeated runs</text>
<rect x="580" y="505" width="440" height="150" rx="23" fill="#132128" stroke="#37545b" stroke-width="2"/><circle cx="631" cy="553" r="24" fill="#79e8d3"/><text x="631" y="562" text-anchor="middle" font-weight="bold" font-size="25" fill="#14200b">5</text><text x="675" y="554" font-size="27" font-weight="bold" fill="#edf6f9">Measure trade-offs</text><text x="610" y="606" font-size="21" fill="#9aafba">Success, p95 speed, real cost</text>
<rect x="1070" y="505" width="440" height="150" rx="23" fill="#132128" stroke="#37545b" stroke-width="2"/><circle cx="1121" cy="553" r="24" fill="#79e8d3"/><text x="1121" y="562" text-anchor="middle" font-weight="bold" font-size="25" fill="#14200b">6</text><text x="1165" y="554" font-size="27" font-weight="bold" fill="#edf6f9">Release gates</text><text x="1100" y="606" font-size="21" fill="#9aafba">Security, privacy, permissions</text>
<path d="M530 580H578M1020 580H1068" stroke="#79e8d3" stroke-width="5" stroke-linecap="round"/>
<path d="M1290 430V503" stroke="#79e8d3" stroke-width="3" stroke-dasharray="7 10"/>
<rect x="450" y="720" width="700" height="113" rx="25" fill="#203425" stroke="#c8ff4d" stroke-width="2"/><circle cx="512" cy="776" r="27" fill="#c8ff4d"/><text x="512" y="785" text-anchor="middle" font-weight="bold" font-size="27" fill="#14200b">7</text><text x="564" y="766" font-weight="bold" font-size="32" fill="#ecf7ea">Ship, monitor and retest</text><text x="564" y="803" font-size="21" fill="#b1c7b4">Choose the simplest option that passes all gates</text><path d="M1290 655V693H800V718" fill="none" stroke="#c8ff4d" stroke-width="4"/>
</g></svg>