<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AI model selection trade-off decision map</title><desc id="desc">Non-negotiable correctness and privacy gates lead into comparisons of task quality, cost per accepted outcome, tail latency, and operating complexity. Conceptual, not measured scores.</desc><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1821"/><stop offset="1" stop-color="#070b0e"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg2)"/><text x="90" y="108" font-family="Arial,sans-serif" font-size="21" fill="#79e8d3" font-weight="bold" letter-spacing="3">SXF / AI · THE DECISION MAP</text><text x="90" y="170" font-family="Arial,sans-serif" font-size="56" fill="#f2f7f9" font-weight="bold">The right model is a trade-off.</text><text x="90" y="221" font-family="Arial,sans-serif" font-size="25" fill="#a3b3bd">A conceptual map — no invented model scores</text>
