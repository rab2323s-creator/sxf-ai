<text x="90" y="814" font-size="24" font-weight="bold" fill="#d1e0df">DECISION: Choose the lowest-complexity candidate that passes every required gate.</text><text x="90" y="853" font-size="19" fill="#8da2a7">This visual is a decision framework; it is not a performance chart or measured ranking.</text></g></svg>