<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">SXF AI agent evidence gate</title><desc id="desc">Three layers of checks: answer quality, trace and tool correctness, verified downstream outcome and approval; all required for a release. Final answer alone is insufficient.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#12231b"/><stop offset="1" stop-color="#070c0a"/></linearGradient></defs><rect width="1200" height="675" rx="24" fill="#080d0a"/><rect x="25" y="25" width="1150" height="625" rx="22" fill="url(#g)" stroke="#344a3a" stroke-width="2"/><text x="70" y="83" font-family="Arial,sans-serif" fill="#c8ff4d" font-size="21" letter-spacing="3">SXF / ORIGINAL ENGINEERING FRAMEWORK</text><text x="70" y="139" font-family="Arial,sans-serif" fill="#f0f8ed" font-size="36" font-weight="bold">An answer is not an audit trail.</text><g font-family="Arial,sans-serif"><rect x="70" y="205" width="320" height="210" rx="16" fill="#17251b" stroke="#49664a" stroke-width="2"/><text x="96" y="252" fill="#c8ff4d" font-size="17">01 · ANSWER</text><text x="96" y="300" fill="#fff" font-weight="bold" font-size="25">Did it say the</text><text x="96" y="333" fill="#fff" font-weight="bold" font-size="25">right thing?</text><text x="96" y="382" fill="#a5b5a9" font-size="18">References · human review</text><rect x="440" y="205" width="320" height="210" rx="16" fill="#17251b" stroke="#49664a" stroke-width="2"/><text x="466" y="252" fill="#c8ff4d" font-size="17">02 · TRAJECTORY</text><text x="466" y="300" fill="#fff" font-weight="bold" font-size="25">Were the tools,</text><text x="466" y="333" fill="#fff" font-weight="bold" font-size="25">args and retries safe?</text><text x="466" y="382" fill="#a5b5a9" font-size="18">Trace · deterministic checks</text><rect x="810" y="205" width="320" height="210" rx="16" fill="#17251b" stroke="#49664a" stroke-width="2"/><text x="836" y="252" fill="#c8ff4d" font-size="17">03 · VERIFIED OUTCOME</text><text x="836" y="300" fill="#fff" font-weight="bold" font-size="25">Did the real system</text><text x="836" y="333" fill="#fff" font-weight="bold" font-size="25">change as allowed?</text><text x="836" y="382" fill="#a5b5a9" font-size="18">Ledger · policy · approval</text><path d="M390 307h49m-12-9 12 9-12 9M760 307h49m-12-9 12 9-12 9" stroke="#c8ff4d" stroke-width="4" fill="none"/><rect x="270" y="472" width="660" height="105" rx="16" fill="#23391e" stroke="#c8ff4d" stroke-width="3"/><text x="600" y="518" text-anchor="middle" fill="#c8ff4d" font-size="22" font-weight="bold">RELEASE GATE = ALL THREE + SAFETY CONSTRAINTS</text><text x="600" y="549" text-anchor="middle" fill="#d9e8d9" font-size="18">Missing evidence means hold or escalate—not auto-pass.</text></g></svg>