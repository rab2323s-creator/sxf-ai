<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">End-to-end retrieval augmented generation pipeline</title><desc id="desc">Flow diagram showing ingestion, text chunking, embedding generation, vector and keyword indexes, retrieval, reranking, evidence-based answer generation and evaluation.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091420"/><stop offset="1" stop-color="#0d2831"/></linearGradient><linearGradient id="accent" x2="0" x1="1"><stop stop-color="#63dcbd"/><stop offset="1" stop-color="#3faafa"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 10,6 0,11" fill="none" stroke="#76cde3" stroke-width="2"/></marker></defs>
<rect width="1400" height="760" fill="url(#bg)"/><text x="70" y="90" fill="#bad6e8" font-size="25" letter-spacing="4" font-family="Arial,sans-serif">PRODUCTION RAG SYSTEM</text>
<text x="70" y="154" fill="#f0f8ff" font-size="43" font-weight="700" font-family="Arial,sans-serif">From documents to grounded answers</text>
<text x="70" y="194" fill="#a3bbcd" font-size="22" font-family="Arial,sans-serif">Embedding is one stage in a measurable, permission-aware retrieval system.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="71" y="270" width="230" height="143" rx="23" fill="#10293b" stroke="#4985b1" stroke-width="2"/><text x="186" y="317" fill="#81cfff" font-size="18">01 / INGEST</text><text x="186" y="358" fill="white" font-size="27" font-weight="700">Documents</text><text x="186" y="386" fill="#acc9df" font-size="17">Text · PDF · Media</text>
<rect x="366" y="270" width="230" height="143" rx="23" fill="#10293b" stroke="#4985b1" stroke-width="2"/><text x="481" y="317" fill="#81cfff" font-size="18">02 / PREPARE</text><text x="481" y="358" fill="white" font-size="27" font-weight="700">Chunk &amp; label</text><text x="481" y="386" fill="#acc9df" font-size="17">Tokens · metadata · ACL</text>
<rect x="661" y="270" width="230" height="143" rx="23" fill="#11373a" stroke="#38ab99" stroke-width="2"/><text x="776" y="317" fill="#7ff1cf" font-size="18">03 / EMBED</text><text x="776" y="358" fill="white" font-size="27" font-weight="700">Vectors</text><text x="776" y="386" fill="#acd8cb" font-size="17">Gemini or Cohere</text>
<rect x="956" y="270" width="360" height="143" rx="23" fill="#122f42" stroke="#4985b1" stroke-width="2"/><text x="1136" y="317" fill="#81cfff" font-size="18">04 / RETRIEVE</text><text x="1136" y="358" fill="white" font-size="27" font-weight="700">Vector + lexical search</text><text x="1136" y="386" fill="#acc9df" font-size="17">Filters · hybrid retrieval · top K</text>
<path d="M302 341 H360 M597 341 H655 M892 341 H950" stroke="#78d0e9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="956" y="489" width="360" height="126" rx="23" fill="#11353a" stroke="#36bba2" stroke-width="2"/><text x="1136" y="532" fill="#9cf4cf" font-size="18">05 / RERANK</text><text x="1136" y="573" fill="white" font-size="26" font-weight="700">Select evidence</text>
<rect x="520" y="489" width="370" height="126" rx="23" fill="#122f42" stroke="#4985b1" stroke-width="2"/><text x="705" y="532" fill="#8dd5ff" font-size="18">06 / GENERATE</text><text x="705" y="573" fill="white" font-size="26" font-weight="700">Answer with citations</text>
<rect x="70" y="489" width="380" height="126" rx="23" fill="#2a2a30" stroke="#bc9a5b" stroke-width="2"/><text x="260" y="532" fill="#f4d58b" font-size="18">07 / EVALUATE</text><text x="260" y="573" fill="white" font-size="26" font-weight="700">Recall · latency · cost</text>
<path d="M1136 414 V481 M949 552 H899 M511 552 H459" stroke="#78d0e9" stroke-width="4" marker-end="url(#arrow)"/>
</g>
<text x="70" y="710" fill="#9ab9c6" font-size="21" font-family="Arial,sans-serif">Query embedding must match its indexed vector space · Validate data access before retrieval.</text>
</svg>