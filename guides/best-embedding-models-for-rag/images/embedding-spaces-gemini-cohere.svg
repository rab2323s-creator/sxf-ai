<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Gemini and Cohere embedding vector spaces compared</title><desc id="desc">Two separate groups of document and query embeddings. Google Gemini embeddings occupy a blue vector space, Cohere Embed 5 shares a teal vector space between Pro and Fast. Switching families requires re-embedding a corpus.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09111e"/><stop offset="1" stop-color="#101e31"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#367bea"/><stop offset="1" stop-color="#72cfff"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#13abac"/><stop offset="1" stop-color="#67e5b3"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><pattern id="dots" width="39" height="39" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".07"/></pattern></defs>
<rect width="1400" height="760" fill="url(#bg)"/><rect width="1400" height="760" fill="url(#dots)"/><text x="84" y="90" fill="#cdddf4" font-size="26" font-family="Arial,sans-serif" letter-spacing="4">EMBEDDING SPACE ARCHITECTURE</text>
<text x="84" y="150" fill="white" font-size="43" font-weight="700" font-family="Arial,sans-serif">Same dimension ≠ same vector space</text><text x="84" y="194" fill="#9babc2" font-size="23" font-family="Arial,sans-serif">Evaluate and index each model family independently</text>
<rect x="70" y="252" width="607" height="384" rx="30" fill="#0f2039" stroke="#2b568e" stroke-width="2"/><rect x="724" y="252" width="607" height="384" rx="30" fill="#0b292e" stroke="#266b66" stroke-width="2"/>
<text x="109" y="304" font-size="25" font-weight="bold" fill="#92cfff" font-family="Arial,sans-serif">GOOGLE GEMINI</text><text x="760" y="304" font-size="25" font-weight="bold" fill="#89efcf" font-family="Arial,sans-serif">COHERE EMBED 5</text>
<text x="109" y="338" font-size="17" fill="#9cbbd5" font-family="Arial,sans-serif">Embedding 001 ≠ Embedding 2</text><text x="760" y="338" font-size="17" fill="#8bbaa9" font-family="Arial,sans-serif">Pro ↔ Fast in one shared space</text>
<g stroke="#62baff" stroke-width="2" opacity=".5"><path d="M180 433 246 387 312 470 399 393 499 450 573 384"/><path d="M180 433 286 537 399 393 472 531 573 384"/><path d="M312 470 472 531"/></g>
<g fill="#72cfff"><circle cx="180" cy="433" r="12"/><circle cx="246" cy="387" r="11"/><circle cx="312" cy="470" r="14"/><circle cx="399" cy="393" r="12"/><circle cx="499" cy="450" r="14"/><circle cx="573" cy="384" r="11"/><circle cx="286" cy="537" r="13"/><circle cx="472" cy="531" r="10"/></g>
<g stroke="#4de6c9" stroke-width="2" opacity=".5"><path d="M837 420 910 382 1005 456 1087 399 1180 449 1254 382"/><path d="M837 420 923 530 1005 456 1141 531 1254 382"/><path d="M1087 399 1141 531"/></g>
<g fill="#68ebc4"><circle cx="837" cy="420" r="12"/><circle cx="910" cy="382" r="11"/><circle cx="1005" cy="456" r="14"/><circle cx="1087" cy="399" r="12"/><circle cx="1180" cy="449" r="14"/><circle cx="1254" cy="382" r="11"/><circle cx="923" cy="530" r="13"/><circle cx="1141" cy="531" r="10"/></g>
<rect x="496" y="567" rx="15" width="150" height="43" fill="#142f51" stroke="#4a94dc"/><text x="514" y="596" fill="#bee6ff" font-family="Arial,sans-serif" font-size="19">RE-EMBED</text>
<rect x="749" y="567" rx="15" width="216" height="43" fill="#144a43" stroke="#42bda7"/><text x="771" y="596" fill="#bdffea" font-family="Arial,sans-serif" font-size="19">SHARED INDEX</text>
<text x="74" y="712" fill="#9db3ce" font-size="20" font-family="Arial,sans-serif">Conceptual diagram · not a measured representation of model quality</text></svg>