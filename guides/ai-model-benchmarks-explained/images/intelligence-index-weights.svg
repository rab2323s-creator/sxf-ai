<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Artificial Analysis Intelligence Index benchmark composition</title><desc id="desc">Diagram of the ten component evaluations in four weighted categories: agents 30 percent, coding 20 percent, general 30 percent, scientific reasoning 20 percent.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07121f"/><stop offset="1" stop-color="#152c40"/></linearGradient><linearGradient id="a" x2="1" y2="1"><stop stop-color="#54abff"/><stop offset="1" stop-color="#92dbff"/></linearGradient><linearGradient id="b" x2="1" y2="1"><stop stop-color="#68e1ba"/><stop offset="1" stop-color="#98f0dd"/></linearGradient></defs><rect width="1440" height="760" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="75" y="80" fill="#94bedb" font-size="23" letter-spacing="4">INTELLIGENCE INDEX · COMPOSITION</text><text x="75" y="145" fill="#f3f9ff" font-size="48" font-weight="bold">One index. Ten separate evaluations.</text><text x="75" y="192" fill="#acc6da" font-size="22">Current v4.3.2 weighting from Artificial Analysis methodology</text><g><rect x="75" y="246" width="1290" height="88" rx="18" fill="#193449"/><rect x="75" y="246" width="387" height="88" rx="18" fill="#2e80bb"/><rect x="462" y="246" width="258" height="88" fill="#308a8c"/><rect x="720" y="246" width="387" height="88" fill="#6e68b8"/><rect x="1107" y="246" width="258" height="88" rx="18" fill="#9c864a"/><g text-anchor="middle" fill="#fff" font-size="25" font-weight="bold"><text x="268" y="301">30% Agents</text><text x="591" y="301">20% Coding</text><text x="913" y="301">30% General</text><text x="1236" y="290" font-size="22">20% Science</text></g></g>
<g font-size="22" fill="#e7f4ff"><rect x="75" y="382" width="300" height="288" rx="20" fill="#102d47" stroke="#439ddb"/><text x="104" y="435" fill="#7bc6ff" font-weight="bold">AGENTS</text><text x="104" y="489">AA-Briefcase · 15%</text><text x="104" y="539">GDPval-AA · 10%</text><text x="104" y="589">AutomationBench · 5%</text>
