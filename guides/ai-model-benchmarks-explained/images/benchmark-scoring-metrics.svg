<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">How to interpret different AI benchmark scores</title><desc id="desc">An accessible side-by-side concept illustration of the four evaluation outputs: Elo scoring of deliverables, long-context accuracy, professional-work pairwise ratings and normalized composite Intelligence Index scoring. Scales are not directly interchangeable.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1221"/><stop offset="1" stop-color="#122e37"/></linearGradient><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#92ccdd" stroke-width="2"/></marker></defs><rect width="1440" height="760" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="75" y="82" font-size="22" letter-spacing="4" fill="#9ad2e7">READ THE NUMBER, THEN READ THE TEST</text><text x="75" y="147" font-size="44" font-weight="bold" fill="#f0f8ff">Different benchmark metrics are not interchangeable</text><text x="75" y="191" font-size="22" fill="#a7bdcf">Unit, task, judge, model configuration and uncertainty all matter.</text>
<g font-size="22"><rect x="75" y="244" width="626" height="182" rx="23" fill="#142f47" stroke="#428dcc" stroke-width="2"/><text x="106" y="288" fill="#89ceff" font-size="23" font-weight="bold">AA-Briefcase v1.1</text><text x="106" y="329" fill="#f5faff" font-size="28">Combined Elo · deliverables</text><text x="106" y="369" fill="#bfd2e4" font-size="19">Rubric checks + analytical quality + presentation</text><rect x="738" y="244" width="627" height="182" rx="23" fill="#163e3a" stroke="#4bc5aa" stroke-width="2"/><text x="770" y="288" fill="#92f0cf" font-size="23" font-weight="bold">AA-LCR v1.1</text><text x="770" y="329" fill="#f5faff" font-size="28">Pass@1 accuracy · long documents</text><text x="770" y="369" fill="#bfd2e4" font-size="19">100 questions × 3 repetitions, no external tools</text>
<rect x="75" y="449" width="626" height="182" rx="23" fill="#283050" stroke="#848ad2" stroke-width="2"/><text x="106" y="493" fill="#c0b6ff" font-size="23" font-weight="bold">GDPval-AA v2.1</text><text x="106" y="534" fill="#f5faff" font-size="28">Anchored Elo · occupational tasks</text><text x="106" y="574" fill="#bfd2e4" font-size="19">220 agentic tasks; blind pairwise deliverable judgments</text><rect x="738" y="449" width="627" height="182" rx="23" fill="#413623" stroke="#d4ae66" stroke-width="2"/><text x="770" y="493" fill="#f4d289" font-size="23" font-weight="bold">Intelligence Index v4.3.2</text><text x="770" y="534" fill="#f5faff" font-size="28">Weighted normalized composite</text><text x="770" y="574" fill="#bfd2e4" font-size="19">10 tests across 4 categories, not a direct Elo</text></g>
<path d="M701 336 H736 M701 539 H736" stroke="#95c5d5" stroke-width="3" stroke-dasharray="9 11"/><rect x="382" y="658" width="675" height="58" rx="29" fill="#152b3c" stroke="#588da3"/><text x="720" y="695" font-size="23" font-weight="bold" fill="#d6f4ff" text-anchor="middle">NEVER COMPARE RAW ELO WITH PASS RATE</text></g></svg>