<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">RAG vs fine-tuning vs long context: three ways of using knowledge</title><desc id="desc">Original SXF architecture infographic. RAG searches source documents and inserts only relevant passages. Long context sends a bounded source collection directly in the prompt. Fine-tuning trains model behavior on examples and does not replace a live source of truth.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10232a"/><stop offset="1" stop-color="#070b12"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8ff4d"/><stop offset="1" stop-color="#6ce3ce"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g stroke="#1a3136" opacity=".55"><path d="M0 195H1600M0 385H1600M0 575H1600M0 765H1600"/><path d="M200 0V900M500 0V900M800 0V900M1100 0V900M1400 0V900"/></g><g font-family="Arial,sans-serif"><text x="85" y="90" fill="#c8ff4d" letter-spacing="4" font-size="21" font-weight="bold">SXF / AI · ARCHITECTURE REFERENCE</text><text x="85" y="154" fill="#f1f8f6" font-size="55" font-weight="bold">Three ways to connect an LLM to knowledge.</text><text x="85" y="205" fill="#a8bbc1" font-size="25">The real decision: retrieve facts, provide context or adapt behavior.</text>
<rect x="83" y="281" rx="24" width="438" height="423" fill="#111c25" stroke="#42675e" stroke-width="2"/><text x="114" y="334" fill="#baff80" font-size="33" font-weight="bold">01 · RAG</text><text x="114" y="367" fill="#b5c7ce" font-size="19">Relevant evidence at query time</text><rect x="126" y="405" rx="10" width="141" height="64" fill="#1b3438" stroke="#589c8e"/><text x="196" y="444" fill="#e7faf0" font-size="21" text-anchor="middle">Corpus</text><path d="M267 437H332" stroke="#c8ff4d" stroke-width="4"/><rect x="335" y="405" width="137" height="64" rx="10" fill="#234031" stroke="#6dcab0"/><text x="403" y="444" fill="#e7faf0" font-size="21" text-anchor="middle">Retrieve</text><path d="M403 470V515" stroke="#c8ff4d" stroke-width="4"/><rect x="164" y="518" width="272" height="70" rx="13" fill="#263c2c" stroke="#c8ff4d"/><text x="300" y="548" fill="#e8f8e8" font-size="22" text-anchor="middle">Model + evidence</text><text x="300" y="576" fill="#a7d9c1" font-size="16" text-anchor="middle">Grounded answer + source</text><text x="114" y="656" fill="#a6b9be" font-size="20">Best for changing, searchable data</text>
<rect x="579" y="281" rx="24" width="438" height="423" fill="#111c25" stroke="#4c6681" stroke-width="2"/><text x="610" y="334" fill="#a8caff" font-size="33" font-weight="bold">02 · LONG CONTEXT</text><text x="610" y="367" fill="#b5c7ce" font-size="19">Bounded material passed directly</text><rect x="636" y="407" rx="10" width="326" height="77" fill="#1b3043" stroke="#608fb2"/><text x="799" y="442" fill="#e4f1fc" text-anchor="middle" font-size="23">Documents + prompt</text><text x="799" y="469" fill="#a4bfdd" text-anchor="middle" font-size="16">All selected content fits</text><path d="M799 484V526" stroke="#a8caff" stroke-width="4"/><rect x="654" y="532" width="290" height="64" rx="12" fill="#263c4c" stroke="#9ac8ef"/><text x="799" y="571" fill="#eef5ff" text-anchor="middle" font-size="21">LLM processes context</text><text x="610" y="656" fill="#a6b9be" font-size="20">Best for bounded, one-off synthesis</text>
<rect x="1075" y="281" rx="24" width="438" height="423" fill="#111c25" stroke="#836e9d" stroke-width="2"/><text x="1106" y="334" fill="#dec1ff" font-size="33" font-weight="bold">03 · FINE-TUNING</text><text x="1106" y="367" fill="#b5c7ce" font-size="19">Behavior learned from examples</text><rect x="1135" y="405" rx="10" width="312" height="77" fill="#2d2945" stroke="#ad8ddd"/><text x="1291" y="442" fill="#f1ebff" font-size="22" text-anchor="middle">Labeled examples</text><text x="1291" y="469" fill="#c3b3de" font-size="16" text-anchor="middle">Task/style/format</text><path d="M1291 484V526" stroke="#dec1ff" stroke-width="4"/><rect x="1148" y="532" width="286" height="64" rx="12" fill="#342c49" stroke="#ae8cdf"/><text x="1291" y="570" text-anchor="middle" fill="#f6efff" font-size="22">Adapted weights</text><text x="1106" y="656" fill="#a6b9be" font-size="20">Best for repeatable behavior</text>
<rect x="85" y="754" width="1428" height="77" rx="15" fill="#14241d" stroke="#5d8e70"/><text x="800" y="800" text-anchor="middle" fill="#e4ffd0" font-size="24" font-weight="bold">Not mutually exclusive: long context + retrieval + fine-tuned behavior can be combined.</text><text x="85" y="871" fill="#78959a" font-size="16">Architecture concept diagram · no measured model-performance claims · SXF / AI 2026</text></g></svg>