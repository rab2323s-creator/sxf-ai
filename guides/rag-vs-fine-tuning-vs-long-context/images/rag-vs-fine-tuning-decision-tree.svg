<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Decision tree for RAG vs fine-tuning vs long context</title><desc id="desc">If the task needs frequently updated facts or per-user access control, start with retrieval. If all bounded material fits in one session, test long context first. If task behavior or strict output consistency fails prompt baselines and training is available, consider fine-tuning. Combine strategies where evidence and behavior both matter.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08141a"/><stop offset="1" stop-color="#090d13"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="90" y="82" font-size="21" font-weight="bold" letter-spacing="4" fill="#c8ff4d">SXF / AI · DECISION TREE</text><text x="90" y="151" font-size="55" font-weight="bold" fill="#f1f7f6">Start with the data problem, not a technology.</text><text x="90" y="199" font-size="23" fill="#a8bcc1">Use these gates, then compare verified answers, latency and full lifecycle cost.</text>
<rect x="515" y="242" width="570" height="91" rx="21" fill="#1a3029" stroke="#8adf95" stroke-width="2"/><text x="800" y="279" text-anchor="middle" font-size="26" font-weight="bold" fill="#effce9">Need current, large or access-scoped facts?</text><text x="800" y="312" text-anchor="middle" font-size="18" fill="#bdcfc7">Facts change or users see different records</text><path d="M515 288H270V390" fill="none" stroke="#c8ff4d" stroke-width="4"/><text x="346" y="276" font-size="23" fill="#c8ff4d" font-weight="bold">YES</text><rect x="90" y="398" width="420" height="131" rx="20" fill="#193226" stroke="#78d4a7" stroke-width="3"/><text x="300" y="445" text-anchor="middle" fill="#c8ff4d" font-size="34" font-weight="bold">START WITH RAG</text><text x="300" y="484" text-anchor="middle" fill="#c4e7d4" font-size="20">Retrieve + cite + enforce ACL</text><path d="M1085 288H1324V390" fill="none" stroke="#8ebcff" stroke-width="4"/><text x="1189" y="275" font-size="23" fill="#a9c8ff" font-weight="bold">NO</text><rect x="1091" y="398" width="420" height="131" rx="20" fill="#182c3b" stroke="#7aaad0" stroke-width="3"/><text x="1301" y="444" text-anchor="middle" fill="#b7d9ff" font-size="31" font-weight="bold">TEST LONG CONTEXT</text><text x="1301" y="483" text-anchor="middle" fill="#b5c9d8" font-size="19">Bounded docs + context eval</text>
<path d="M300 529V620H800M1301 529V620H800M800 620V650" stroke="#97c2ad" stroke-width="4" fill="none"/><rect x="428" y="656" width="744" height="103" rx="22" fill="#2b2541" stroke="#b9a3eb" stroke-width="3"/><text x="800" y="700" text-anchor="middle" font-size="29" font-weight="bold" fill="#f0e6ff">Still failing consistent format or task behavior?</text><text x="800" y="733" text-anchor="middle" font-size="20" fill="#cfc4df">Evaluate fine-tuning only if provider, data and privacy allow it</text>
<rect x="418" y="792" width="764" height="61" rx="13" fill="#1d2f25" stroke="#708e6c"/><text x="800" y="829" text-anchor="middle" font-size="23" fill="#e7f8d8" font-weight="bold">Combine methods when both evidence and behavior require support.</text></g></svg>