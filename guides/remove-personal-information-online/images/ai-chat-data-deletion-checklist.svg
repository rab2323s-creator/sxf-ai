<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">SXF AI privacy audit checklist</title><desc id="desc">Separately check conversations, uploaded files, saved memory, public links, and model improvement settings.</desc><rect width="1200" height="620" fill="#0a1517"/><rect x="30" y="30" width="1140" height="560" rx="28" fill="#112326" stroke="#35605a" stroke-width="2"/><text x="75" y="97" font-family="Arial,sans-serif" font-size="22" font-weight="bold" letter-spacing="3" fill="#c8ff4d">SXF / AI DATA DELETION AUDIT</text><text x="75" y="152" font-family="Arial,sans-serif" font-size="40" font-weight="bold" fill="#f1fff1">An AI privacy switch is not a delete-all button.</text><g font-family="Arial,sans-serif"><g transform="translate(72,223)"><rect width="205" height="242" rx="14" fill="#19342c" stroke="#548567"/><circle cx="35" cy="42" r="16" fill="#c8ff4d"/><path d="M27 41 L34 47 L46 33" stroke="#10241a" stroke-width="5" fill="none" stroke-linecap="round"/><text x="20" y="103" font-size="21" font-weight="bold" fill="#edffed">CHATS</text><text x="20" y="143" font-size="17" fill="#b7d8c1">Delete history</text><text x="20" y="174" font-size="17" fill="#b7d8c1">and verify</text></g><g transform="translate(292,223)"><rect width="205" height="242" rx="14" fill="#19342c" stroke="#548567"/><circle cx="35" cy="42" r="16" fill="#c8ff4d"/><path d="M27 41 L34 47 L46 33" stroke="#10241a" stroke-width="5" fill="none" stroke-linecap="round"/><text x="20" y="103" font-size="21" font-weight="bold" fill="#edffed">FILES</text><text x="20" y="143" font-size="17" fill="#b7d8c1">Review uploads</text><text x="20" y="174" font-size="17" fill="#b7d8c1">and projects</text></g><g transform="translate(512,223)"><rect width="205" height="242" rx="14" fill="#19342c" stroke="#548567"/><circle cx="35" cy="42" r="16" fill="#c8ff4d"/><path d="M27 41 L34 47 L46 33" stroke="#10241a" stroke-width="5" fill="none" stroke-linecap="round"/><text x="20" y="103" font-size="21" font-weight="bold" fill="#edffed">MEMORY</text><text x="20" y="143" font-size="17" fill="#b7d8c1">Inspect saved</text><text x="20" y="174" font-size="17" fill="#b7d8c1">personalization</text></g><g transform="translate(732,223)"><rect width="205" height="242" rx="14" fill="#19342c" stroke="#548567"/><circle cx="35" cy="42" r="16" fill="#c8ff4d"/><path d="M27 41 L34 47 L46 33" stroke="#10241a" stroke-width="5" fill="none" stroke-linecap="round"/><text x="20" y="103" font-size="21" font-weight="bold" fill="#edffed">LINKS</text><text x="20" y="143" font-size="17" fill="#b7d8c1">Revoke public</text><text x="20" y="174" font-size="17" fill="#b7d8c1">shares</text></g><g transform="translate(952,223)"><rect width="181" height="242" rx="14" fill="#19342c" stroke="#548567"/><circle cx="35" cy="42" r="16" fill="#c8ff4d"/><path d="M27 41 L34 47 L46 33" stroke="#10241a" stroke-width="5" fill="none" stroke-linecap="round"/><text x="20" y="103" font-size="21" font-weight="bold" fill="#edffed">TRAINING</text><text x="20" y="143" font-size="17" fill="#b7d8c1">Choose future</text><text x="20" y="174" font-size="17" fill="#b7d8c1">data use</text></g></g><text x="75" y="532" font-family="Arial,sans-serif" font-size="19" fill="#bbd4c6">Account settings, retention, source copies and model training are separate privacy questions.</text></svg>