<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">The SXF four-layer removal map</title><desc id="desc">Four distinct layers: Google Search, source website, data brokers, and AI accounts. Separate requests are required.</desc><rect width="1200" height="620" fill="#0b1616"/><rect x="30" y="30" width="1140" height="560" rx="26" fill="#12221e" stroke="#355d45" stroke-width="2"/><text x="70" y="90" fill="#c8ff4d" font-family="Arial,sans-serif" font-size="22" font-weight="bold" letter-spacing="4">SXF / FOUR-LAYER PRIVACY MODEL</text><text x="70" y="139" fill="#f4fff0" font-family="Arial,sans-serif" font-size="39" font-weight="bold">One exposed record. Four separate actions.</text><g font-family="Arial,sans-serif"><g transform="translate(70 196)"><rect width="248" height="300" rx="16" fill="#1b3930" stroke="#568b60"/><text x="20" y="67" fill="#c8ff4d" font-size="51" font-weight="bold">01</text><text x="20" y="119" fill="#f0ffec" font-size="22" font-weight="bold">SEARCH</text><text x="20" y="152" fill="#f0ffec" font-size="22" font-weight="bold">RESULTS</text><text x="20" y="202" fill="#c2d9c7" font-size="17">Ask Google or Bing</text><text x="20" y="230" fill="#c2d9c7" font-size="17">to delist a result</text><rect x="19" y="260" width="152" height="2" fill="#c8ff4d"/></g><g transform="translate(344 196)"><rect width="248" height="300" rx="16" fill="#1b3930" stroke="#568b60"/><text x="20" y="67" fill="#c8ff4d" font-size="51" font-weight="bold">02</text><text x="20" y="119" fill="#f0ffec" font-size="22" font-weight="bold">SOURCE</text><text x="20" y="152" fill="#f0ffec" font-size="22" font-weight="bold">WEBSITE</text><text x="20" y="202" fill="#c2d9c7" font-size="17">Request deletion at</text><text x="20" y="230" fill="#c2d9c7" font-size="17">the original host</text><rect x="19" y="260" width="152" height="2" fill="#c8ff4d"/></g><g transform="translate(618 196)"><rect width="248" height="300" rx="16" fill="#1b3930" stroke="#568b60"/><text x="20" y="67" fill="#c8ff4d" font-size="51" font-weight="bold">03</text><text x="20" y="119" fill="#f0ffec" font-size="22" font-weight="bold">DATA</text><text x="20" y="152" fill="#f0ffec" font-size="22" font-weight="bold">BROKERS</text><text x="20" y="202" fill="#c2d9c7" font-size="17">Opt out of profiles</text><text x="20" y="230" fill="#c2d9c7" font-size="17">and revisit later</text><rect x="19" y="260" width="152" height="2" fill="#c8ff4d"/></g><g transform="translate(892 196)"><rect width="238" height="300" rx="16" fill="#1b3930" stroke="#568b60"/><text x="20" y="67" fill="#c8ff4d" font-size="51" font-weight="bold">04</text><text x="20" y="119" fill="#f0ffec" font-size="22" font-weight="bold">AI TOOLS</text><text x="20" y="172" fill="#c2d9c7" font-size="17">Audit chats, files,</text><text x="20" y="200" fill="#c2d9c7" font-size="17">memory and links</text><rect x="19" y="260" width="152" height="2" fill="#c8ff4d"/></g></g><text x="70" y="553" fill="#adc7b5" font-size="20" font-family="Arial,sans-serif">Delisting ≠ source deletion ≠ broker suppression ≠ AI account deletion</text></svg>