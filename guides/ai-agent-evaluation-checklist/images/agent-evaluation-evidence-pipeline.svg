<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101a"/><stop offset="1" stop-color="#10343a"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g opacity=".09" stroke="#baf4e0"><path d="M100 80V840"/><path d="M225 80V840"/><path d="M350 80V840"/><path d="M475 80V840"/><path d="M600 80V840"/><path d="M725 80V840"/><path d="M850 80V840"/><path d="M975 80V840"/><path d="M1100 80V840"/><path d="M1225 80V840"/><path d="M1350 80V840"/><path d="M1475 80V840"/><path d="M75 115h1450"/><path d="M75 220h1450"/><path d="M75 325h1450"/><path d="M75 430h1450"/><path d="M75 535h1450"/><path d="M75 640h1450"/><path d="M75 745h1450"/></g><title id="t">SXF AI agent evaluation evidence pipeline</title><desc id="d">Five steps from defining a task through isolated trials and traces to verified outcomes and safety release gates.</desc><text x="75" y="85" font-family="Arial" font-size="22" fill="#c8fa72" font-weight="800" letter-spacing="4">SXF / AI · ORIGINAL RESEARCH DIAGRAM</text><text x="75" y="171" font-size="66" fill="#f2f8fc" font-family="Arial" font-weight="800">Test the action. Verify the outcome.</text><text x="75" y="229" font-size="30" fill="#abc4d5" font-family="Arial">Evidence-based evaluation across the entire agent workflow.</text><rect x="74" y="333" width="285" height="353" rx="21" fill="#122938" stroke="#35546b" stroke-width="1.5"/><text x="98" y="401" fill="#beff72" font-family="Arial" font-size="31" font-weight="800">01</text><text x="98" y="462" fill="#f4f8fc" font-family="Arial" font-size="29" font-weight="800">SPECIFY</text><path d="M98 494h236" stroke="#4b677a"/><text x="98" y="558" fill="#c3d9e9" font-family="Arial" font-size="23">Real task</text><text x="98" y="601" fill="#96b8c8" font-family="Arial" font-size="22">Known success criteria</text><path d="M363 490h9" stroke="#c8fa72" stroke-width="5"/><path d="M366 480l12 10-12 10" fill="none" stroke="#c8fa72" stroke-width="4"/><rect x="378" y="333" width="285" height="353" rx="21" fill="#122938" stroke="#35546b" stroke-width="1.5"/><text x="402" y="401" fill="#beff72" font-family="Arial" font-size="31" font-weight="800">02</text><text x="402" y="462" fill="#f4f8fc" font-family="Arial" font-size="29" font-weight="800">EXECUTE</text><path d="M402 494h236" stroke="#4b677a"/><text x="402" y="558" fill="#c3d9e9" font-family="Arial" font-size="23">Isolated trials</text><text x="402" y="601" fill="#96b8c8" font-family="Arial" font-size="22">Scoped permissions</text><path d="M667 490h9" stroke="#c8fa72" stroke-width="5"/><path d="M670 480l12 10-12 10" fill="none" stroke="#c8fa72" stroke-width="4"/><rect x="682" y="333" width="285" height="353" rx="21" fill="#122938" stroke="#35546b" stroke-width="1.5"/><text x="706" y="401" fill="#beff72" font-family="Arial" font-size="31" font-weight="800">03</text><text x="706" y="462" fill="#f4f8fc" font-family="Arial" font-size="29" font-weight="800">OBSERVE</text><path d="M706 494h236" stroke="#4b677a"/><text x="706" y="558" fill="#c3d9e9" font-family="Arial" font-size="23">Tool-call traces</text><text x="706" y="601" fill="#96b8c8" font-family="Arial" font-size="22">Retries + side effects</text><path d="M971 490h9" stroke="#c8fa72" stroke-width="5"/><path d="M974 480l12 10-12 10" fill="none" stroke="#c8fa72" stroke-width="4"/><rect x="986" y="333" width="285" height="353" rx="21" fill="#122938" stroke="#35546b" stroke-width="1.5"/><text x="1010" y="401" fill="#beff72" font-family="Arial" font-size="31" font-weight="800">04</text><text x="1010" y="462" fill="#f4f8fc" font-family="Arial" font-size="29" font-weight="800">VERIFY</text><path d="M1010 494h236" stroke="#4b677a"/><text x="1010" y="558" fill="#c3d9e9" font-family="Arial" font-size="23">Actual end state</text><text x="1010" y="601" fill="#96b8c8" font-family="Arial" font-size="22">Objective graders</text><path d="M1275 490h9" stroke="#c8fa72" stroke-width="5"/><path d="M1278 480l12 10-12 10" fill="none" stroke="#c8fa72" stroke-width="4"/><rect x="1290" y="333" width="285" height="353" rx="21" fill="#122938" stroke="#ccf978" stroke-width="3"/><text x="1314" y="401" fill="#beff72" font-family="Arial" font-size="31" font-weight="800">05</text><text x="1314" y="462" fill="#f4f8fc" font-family="Arial" font-size="29" font-weight="800">DECIDE</text><path d="M1314 494h236" stroke="#4b677a"/><text x="1314" y="558" fill="#c3d9e9" font-family="Arial" font-size="23">Security hard gates</text><text x="1314" y="601" fill="#96b8c8" font-family="Arial" font-size="22">Regression checks</text><rect x="74" y="730" width="1450" height="102" rx="18" fill="#182e39" stroke="#3b5968"/><text x="117" y="790" fill="#dcff91" font-size="28" font-weight="700" font-family="Arial">Critical rule:</text><text x="294" y="790" fill="#edf5f9" font-size="27" font-family="Arial">a severe authorization or data-leak failure overrides the average score.</text></svg>