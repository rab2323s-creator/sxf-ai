<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101a"/><stop offset="1" stop-color="#10343a"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g opacity=".09" stroke="#baf4e0"><path d="M100 80V840"/><path d="M225 80V840"/><path d="M350 80V840"/><path d="M475 80V840"/><path d="M600 80V840"/><path d="M725 80V840"/><path d="M850 80V840"/><path d="M975 80V840"/><path d="M1100 80V840"/><path d="M1225 80V840"/><path d="M1350 80V840"/><path d="M1475 80V840"/><path d="M75 115h1450"/><path d="M75 220h1450"/><path d="M75 325h1450"/><path d="M75 430h1450"/><path d="M75 535h1450"/><path d="M75 640h1450"/><path d="M75 745h1450"/></g><title id="t">SXF AI agent evaluation scorecard with 25 practical tests</title><desc id="d">Five rows for outcome success, memory, tool use, security and efficiency, each containing five test categories.</desc><text x="80" y="92" font-size="23" letter-spacing="4" fill="#c8fa72" font-family="Arial" font-weight="800">SXF / AI · 25-TEST EVALUATION SCORECARD</text><text x="80" y="175" font-family="Arial" font-size="68" fill="#eef8fc" font-weight="800">Five dimensions. Twenty-five tests.</text><text x="80" y="232" fill="#abc7d3" font-size="28" font-family="Arial">Measure outcomes, memory, tools, security and efficiency separately.</text><rect x="77" y="311" width="285" height="443" rx="20" fill="#132834" stroke="#3d5968"/><rect x="97" y="329" width="244" height="8" rx="4" fill="#ceff73"/><text x="97" y="389" fill="#ceff73" font-size="28" font-family="Arial" font-weight="800">01–05</text><text x="97" y="442" fill="#f0f7fb" font-size="27" font-family="Arial" font-weight="800">OUTCOMES</text><rect x="98" y="480" width="19" height="19" rx="4" stroke="#ceff73" fill="#234050"/><text x="129" y="497" fill="#ccdae6" font-family="Arial" font-size="18">End-state proof</text><rect x="98" y="525" width="19" height="19" rx="4" stroke="#ceff73" fill="#234050"/><text x="129" y="542" fill="#ccdae6" font-family="Arial" font-size="18">Clarity + truthfulness</text><rect x="98" y="570" width="19" height="19" rx="4" stroke="#ceff73" fill="#234050"/><text x="129" y="587" fill="#ccdae6" font-family="Arial" font-size="18">Repeatability</text><rect x="98" y="615" width="19" height="19" rx="4" stroke="#ceff73" fill="#234050"/><text x="129" y="632" fill="#ccdae6" font-family="Arial" font-size="18">Partial failure</text><rect x="98" y="660" width="19" height="19" rx="4" stroke="#ceff73" fill="#234050"/><text x="129" y="677" fill="#ccdae6" font-family="Arial" font-size="18">Recovery</text></rect><rect x="382" y="311" width="285" height="443" rx="20" fill="#132834" stroke="#3d5968"/><rect x="402" y="329" width="244" height="8" rx="4" fill="#83e9cf"/><text x="402" y="389" fill="#83e9cf" font-size="28" font-family="Arial" font-weight="800">06–10</text><text x="402" y="442" fill="#f0f7fb" font-size="27" font-family="Arial" font-weight="800">MEMORY</text><rect x="403" y="480" width="19" height="19" rx="4" stroke="#83e9cf" fill="#234050"/><text x="434" y="497" fill="#ccdae6" font-family="Arial" font-size="18">Session context</text><rect x="403" y="525" width="19" height="19" rx="4" stroke="#83e9cf" fill="#234050"/><text x="434" y="542" fill="#ccdae6" font-family="Arial" font-size="18">User boundaries</text><rect x="403" y="570" width="19" height="19" rx="4" stroke="#83e9cf" fill="#234050"/><text x="434" y="587" fill="#ccdae6" font-family="Arial" font-size="18">Stale facts</text><rect x="403" y="615" width="19" height="19" rx="4" stroke="#83e9cf" fill="#234050"/><text x="434" y="632" fill="#ccdae6" font-family="Arial" font-size="18">Conflicts</text><rect x="403" y="660" width="19" height="19" rx="4" stroke="#83e9cf" fill="#234050"/><text x="434" y="677" fill="#ccdae6" font-family="Arial" font-size="18">Poisoned notes</text></rect><rect x="687" y="311" width="285" height="443" rx="20" fill="#132834" stroke="#3d5968"/><rect x="707" y="329" width="244" height="8" rx="4" fill="#86c5ff"/><text x="707" y="389" fill="#86c5ff" font-size="28" font-family="Arial" font-weight="800">11–15</text><text x="707" y="442" fill="#f0f7fb" font-size="27" font-family="Arial" font-weight="800">TOOLS</text><rect x="708" y="480" width="19" height="19" rx="4" stroke="#86c5ff" fill="#234050"/><text x="739" y="497" fill="#ccdae6" font-family="Arial" font-size="18">Routing</text><rect x="708" y="525" width="19" height="19" rx="4" stroke="#86c5ff" fill="#234050"/><text x="739" y="542" fill="#ccdae6" font-family="Arial" font-size="18">API schema</text><rect x="708" y="570" width="19" height="19" rx="4" stroke="#86c5ff" fill="#234050"/><text x="739" y="587" fill="#ccdae6" font-family="Arial" font-size="18">Idempotency</text><rect x="708" y="615" width="19" height="19" rx="4" stroke="#86c5ff" fill="#234050"/><text x="739" y="632" fill="#ccdae6" font-family="Arial" font-size="18">Hostile results</text><rect x="708" y="660" width="19" height="19" rx="4" stroke="#86c5ff" fill="#234050"/><text x="739" y="677" fill="#ccdae6" font-family="Arial" font-size="18">Data consistency</text></rect><rect x="992" y="311" width="285" height="443" rx="20" fill="#132834" stroke="#3d5968"/><rect x="1012" y="329" width="244" height="8" rx="4" fill="#ffb992"/><text x="1012" y="389" fill="#ffb992" font-size="28" font-family="Arial" font-weight="800">16–20</text><text x="1012" y="442" fill="#f0f7fb" font-size="27" font-family="Arial" font-weight="800">SECURITY</text><rect x="1013" y="480" width="19" height="19" rx="4" stroke="#ffb992" fill="#234050"/><text x="1044" y="497" fill="#ccdae6" font-family="Arial" font-size="18">Prompt injection</text><rect x="1013" y="525" width="19" height="19" rx="4" stroke="#ffb992" fill="#234050"/><text x="1044" y="542" fill="#ccdae6" font-family="Arial" font-size="18">Least privilege</text><rect x="1013" y="570" width="19" height="19" rx="4" stroke="#ffb992" fill="#234050"/><text x="1044" y="587" fill="#ccdae6" font-family="Arial" font-size="18">Human approval</text><rect x="1013" y="615" width="19" height="19" rx="4" stroke="#ffb992" fill="#234050"/><text x="1044" y="632" fill="#ccdae6" font-family="Arial" font-size="18">Secret safety</text><rect x="1013" y="660" width="19" height="19" rx="4" stroke="#ffb992" fill="#234050"/><text x="1044" y="677" fill="#ccdae6" font-family="Arial" font-size="18">Delegation</text></rect><rect x="1297" y="311" width="285" height="443" rx="20" fill="#132834" stroke="#3d5968"/><rect x="1317" y="329" width="244" height="8" rx="4" fill="#c8b2ff"/><text x="1317" y="389" fill="#c8b2ff" font-size="28" font-family="Arial" font-weight="800">21–25</text><text x="1317" y="442" fill="#f0f7fb" font-size="27" font-family="Arial" font-weight="800">EFFICIENCY</text><rect x="1318" y="480" width="19" height="19" rx="4" stroke="#c8b2ff" fill="#234050"/><text x="1349" y="497" fill="#ccdae6" font-family="Arial" font-size="18">Tail latency</text><rect x="1318" y="525" width="19" height="19" rx="4" stroke="#c8b2ff" fill="#234050"/><text x="1349" y="542" fill="#ccdae6" font-family="Arial" font-size="18">Accepted cost</text><rect x="1318" y="570" width="19" height="19" rx="4" stroke="#c8b2ff" fill="#234050"/><text x="1349" y="587" fill="#ccdae6" font-family="Arial" font-size="18">Token budget</text><rect x="1318" y="615" width="19" height="19" rx="4" stroke="#c8b2ff" fill="#234050"/><text x="1349" y="632" fill="#ccdae6" font-family="Arial" font-size="18">Regressions</text><rect x="1318" y="660" width="19" height="19" rx="4" stroke="#c8b2ff" fill="#234050"/><text x="1349" y="677" fill="#ccdae6" font-family="Arial" font-size="18">Stop logic</text></rect><rect x="77" y="800" width="1445" height="61" rx="14" fill="#28322d" stroke="#89a966"/><text x="115" y="840" fill="#d8ffa2" font-size="26" font-family="Arial" font-weight="700">Evidence first.</text><text x="309" y="840" fill="#eef5fa" font-size="25" font-family="Arial">Untested ≠ Passed. Safety gates ≠ Average scores. </text></svg>