<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Framework benchmark evidence pipeline</title><desc id="d">An SXF original diagram: common support policy task across five framework adapters, independent verification, and measurement of accuracy, unauthorized actions, p95 latency, cost and retries.</desc><defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a171d"/><stop offset="1" stop-color="#0a0d14"/></linearGradient></defs><rect width="1600" height="900" fill="url(#c)"/><text x="90" y="97" font-family="Arial,sans-serif" font-size="22" fill="#83ffcf" letter-spacing="4" font-weight="bold">SXF / AI · TEST THE SAME TASK</text><text x="90" y="162" font-family="Arial,sans-serif" font-size="58" font-weight="bold" fill="#f4f9f8">Evidence before framework preference.</text><text x="90" y="212" font-family="Arial,sans-serif" font-size="26" fill="#a4b7bb">Same task + model settings → different orchestration → verified outcomes</text>
<rect x="94" y="289" width="550" height="108" rx="21" fill="#102028" stroke="#2f5252" stroke-width="2"/><circle cx="150" cy="343" r="31" fill="#c8ff4d"/><text x="150" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#101b14">01</text><text x="205" y="335" font-family="Arial,sans-serif" font-size="24" fill="#f0f8f5" font-weight="bold">FIX THE TASK</text><text x="205" y="365" font-family="Arial,sans-serif" font-size="19" fill="#9cbdbe">Shared synthetic policy fixture</text><path d="M366 397V418" stroke="#7be6c8" stroke-width="4"/><rect x="94" y="421" width="550" height="108" rx="21" fill="#102028" stroke="#2f5252" stroke-width="2"/><circle cx="150" cy="475" r="31" fill="#83ffcf"/><text x="150" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#101b14">02</text><text x="205" y="467" font-family="Arial,sans-serif" font-size="24" fill="#f0f8f5" font-weight="bold">SWAP THE ADAPTER</text><text x="205" y="497" font-family="Arial,sans-serif" font-size="19" fill="#9cbdbe">Five framework implementations</text><path d="M366 529V550" stroke="#7be6c8" stroke-width="4"/><rect x="94" y="553" width="550" height="108" rx="21" fill="#102028" stroke="#2f5252" stroke-width="2"/><circle cx="150" cy="607" r="31" fill="#c8ff4d"/><text x="150" y="616" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#101b14">03</text><text x="205" y="599" font-family="Arial,sans-serif" font-size="24" fill="#f0f8f5" font-weight="bold">VERIFY THE RESULT</text><text x="205" y="629" font-family="Arial,sans-serif" font-size="19" fill="#9cbdbe">Decision + side effects + trace</text><path d="M366 661V682" stroke="#7be6c8" stroke-width="4"/><rect x="94" y="685" width="550" height="108" rx="21" fill="#102028" stroke="#2f5252" stroke-width="2"/><circle cx="150" cy="739" r="31" fill="#83ffcf"/><text x="150" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#101b14">04</text><text x="205" y="731" font-family="Arial,sans-serif" font-size="24" fill="#f0f8f5" font-weight="bold">COMPARE EVIDENCE</text><text x="205" y="761" font-family="Arial,sans-serif" font-size="19" fill="#9cbdbe">Success · p95 · cost · recovery</text>
