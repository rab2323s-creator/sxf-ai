<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">Ollama vs LM Studio vs vLLM deployment paths</title><desc id="d">Three distinct local AI workflows: Ollama for quick terminal and local API, LM Studio for desktop and local server, vLLM for dedicated GPU serving and concurrent requests. All run open-weight models on supported hardware.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081524"/><stop offset="1" stop-color="#112e40"/></linearGradient><linearGradient id="og" x2="1" y2="1"><stop stop-color="#529fff"/><stop offset="1" stop-color="#94deff"/></linearGradient><linearGradient id="lg" x2="1" y2="1"><stop stop-color="#5ff3b9"/><stop offset="1" stop-color="#22b49f"/></linearGradient><linearGradient id="vg" x2="1" y2="1"><stop stop-color="#d2b0ff"/><stop offset="1" stop-color="#808efa"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ffff" opacity=".055"/></pattern></defs><rect width="1440" height="810" fill="url(#bg)"/><rect width="1440" height="810" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="75" y="82" fill="#9dc4d8" font-size="23" letter-spacing="4">LOCAL LLM RUNTIME ARCHITECTURES</text><text x="75" y="148" fill="#f5fbff" font-weight="700" font-size="49">Three routes to private AI inference</text><text x="75" y="194" fill="#b3ccdb" font-size="22">Choose the deployment pattern before choosing the largest model.</text>
<g><rect x="74" y="262" width="401" height="377" rx="28" fill="#102940" stroke="#3c8ac5" stroke-width="2"/><rect x="520" y="262" width="401" height="377" rx="28" fill="#12383a" stroke="#30aa96" stroke-width="2"/><rect x="966" y="262" width="400" height="377" rx="28" fill="#242b50" stroke="#7e82d2" stroke-width="2"/>
<text x="112" y="315" fill="#8aceff" font-size="24" font-weight="700">OLLAMA</text><text x="558" y="315" fill="#97edd6" font-size="24" font-weight="700">LM STUDIO</text><text x="1004" y="315" fill="#c3b6ff" font-size="24" font-weight="700">vLLM</text>
<text x="112" y="351" fill="#ecf6ff" font-size="20">CLI + local API</text><text x="558" y="351" fill="#ecf6ff" font-size="20">Desktop + local API</text><text x="1004" y="351" fill="#ecf6ff" font-size="20">GPU inference server</text>
<rect x="111" y="387" width="327" height="120" rx="16" fill="#091c30" stroke="#4279a5"/><rect x="557" y="387" width="327" height="120" rx="16" fill="#0c282b" stroke="#308579"/><rect x="1003" y="387" width="326" height="120" rx="16" fill="#171d3c" stroke="#787bca"/>
<g fill="#9dd6ff" font-size="23" font-family="monospace"><text x="136" y="433">$ ollama run</text><text x="136" y="473">localhost:11434</text></g><g fill="#9aefdd" font-size="22" font-family="monospace"><text x="580" y="433">Discover → Load</text><text x="580" y="473">localhost:1234</text></g><g fill="#c8bcff" font-size="22" font-family="monospace"><text x="1025" y="433">$ vllm serve</text><text x="1025" y="473">localhost:8000</text></g>
<text x="111" y="554" fill="#c9dfed" font-size="20">Fast local experiments</text><text x="557" y="554" fill="#c9dfed" font-size="20">Visual model selection</text><text x="1003" y="554" fill="#c9dfed" font-size="20">Batching and concurrency</text>
<text x="111" y="589" fill="#9fbdd0" font-size="18">CPU / supported GPU</text><text x="557" y="589" fill="#9fbdd0" font-size="18">GGUF / MLX support</text><text x="1003" y="589" fill="#9fbdd0" font-size="18">Backend-specific install</text></g>
<path d="M265 644 V686 H1159 V644" fill="none" stroke="#76bcce" stroke-width="3" stroke-dasharray="8 10"/><rect x="371" y="672" width="700" height="55" rx="25" fill="#183343" stroke="#5c91a6"/><text x="721" y="706" text-anchor="middle" fill="#d9eaf6" font-size="22" font-weight="700">MODEL WEIGHTS + RAM / VRAM + KV CACHE</text>
<text x="75" y="778" fill="#8caabd" font-size="17">Conceptual architecture. Backend and OS support vary; check vendor documentation.</text></g></svg>