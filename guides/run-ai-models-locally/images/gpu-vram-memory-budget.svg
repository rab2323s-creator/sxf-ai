<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="t d"><title id="t">What fills GPU VRAM when running an LLM locally</title><desc id="d">A schematic GPU memory budget with model weights, KV cache from active context and concurrency, runtime buffers, and headroom, plus a reminder that quantization changes weight size but not all other allocations.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1322"/><stop offset="1" stop-color="#102f37"/></linearGradient></defs><rect width="1440" height="810" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="80" y="85" font-size="23" letter-spacing="4" fill="#a4c5dc">LOCAL MODEL HARDWARE PLANNING</text><text x="80" y="149" fill="#f7fbff" font-size="48" font-weight="700">Why model file size ≠ VRAM requirement</text><text x="80" y="194" fill="#b5c8d7" font-size="22">An illustrative budget: no exact memory usage is implied by this schematic.</text>
<rect x="80" y="269" width="1280" height="166" rx="23" fill="#0b1f31" stroke="#567e93" stroke-width="3"/>
<path d="M104 295 H752 V409 H104 Z" fill="#438ada"/><path d="M752 295 H1095 V409 H752 Z" fill="#2ab89f"/><path d="M1095 295 H1233 V409 H1095 Z" fill="#918fe7"/><path d="M1233 295 H1336 V409 H1233 Z" fill="#cca362"/>
<g font-size="22" font-weight="700" fill="#fff" text-anchor="middle"><text x="427" y="355">MODEL WEIGHTS</text><text x="924" y="355">KV CACHE</text><text x="1164" y="342" font-size="17">RUNTIME</text><text x="1284" y="341" font-size="17">FREE</text></g>
<rect x="80" y="483" width="600" height="187" rx="21" fill="#142d46" stroke="#4583b9"/><rect x="720" y="483" width="640" height="187" rx="21" fill="#133b37" stroke="#40aa98"/>
<text x="115" y="540" fill="#8fcaff" font-size="22" font-weight="700">WEIGHT STORAGE</text><text x="115" y="586" fill="#fff" font-size="30">Parameters × bits / 8</text><text x="115" y="632" fill="#b3cee2" font-size="21">Quantization reduces this component</text>
<text x="756" y="540" fill="#9cf2d4" font-size="22" font-weight="700">CONTEXT + CONCURRENCY</text><text x="756" y="586" fill="#fff" font-size="28">KV allocation + active sequences</text><text x="756" y="632" fill="#badcd3" font-size="21">Depends on architecture and runtime</text>
<text x="80" y="734" fill="#a7c5d0" font-size="20">Additional: activations · kernels · fragmentation · OS and graphics allocations</text><text x="80" y="775" fill="#8ba5b7" font-size="17">Diagram is illustrative, not an empirical hardware benchmark. Test actual allocations with tools such as nvidia-smi.</text></g></svg>