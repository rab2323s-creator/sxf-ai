<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Commercial AI Model Licensing: Evidence Layers"><rect width="1600" height="900" fill="#09131a"/><g font-family="Arial,sans-serif"><text x="65" y="80" fill="#c8ff4d" font-size="25" font-weight="700">SXF / AI · ORIGINAL DUE DILIGENCE FRAMEWORK</text><text x="65" y="153" fill="#f4f9f1" font-size="47" font-weight="800">Commercial AI Model Licensing: Evidence Layers</text><text x="65" y="203" fill="#aabfb5" font-size="23">A reproducible legal/engineering handoff, not automatic legal permission</text><rect x="64" y="283" width="477" height="180" rx="23" fill="#14291f" stroke="#81a77d" stroke-width="2"/><text x="86" y="332" fill="#c8ff4d" font-size="22">01 · ARTIFACT</text><text x="86" y="386" fill="#f6faf3" font-size="29" font-weight="700">Weights + revision</text><text x="86" y="429" fill="#b9d0c2" font-size="21">Hash · origin · scope</text><rect x="573" y="283" width="477" height="180" rx="23" fill="#14291f" stroke="#81a77d" stroke-width="2"/><text x="595" y="332" fill="#c8ff4d" font-size="22">02 · GRANT</text><text x="595" y="386" fill="#f6faf3" font-size="29" font-weight="700">Governing license</text><text x="595" y="429" fill="#b9d0c2" font-size="21">MIT · Apache · custom</text><rect x="1082" y="283" width="477" height="180" rx="23" fill="#14291f" stroke="#81a77d" stroke-width="2"/><text x="1104" y="332" fill="#c8ff4d" font-size="22">03 · TERMS</text><text x="1104" y="386" fill="#f6faf3" font-size="29" font-weight="700">Additional conditions</text><text x="1104" y="429" fill="#b9d0c2" font-size="21">Policy · territory · use</text><rect x="64" y="511" width="477" height="180" rx="23" fill="#14291f" stroke="#81a77d" stroke-width="2"/><text x="86" y="560" fill="#c8ff4d" font-size="22">04 · PACKAGE</text><text x="86" y="614" fill="#f6faf3" font-size="29" font-weight="700">Distribution proof</text><text x="86" y="657" fill="#b9d0c2" font-size="21">NOTICE · modifications</text><rect x="573" y="511" width="477" height="180" rx="23" fill="#14291f" stroke="#81a77d" stroke-width="2"/><text x="595" y="560" fill="#c8ff4d" font-size="22">05 · SYSTEM</text><text x="595" y="614" fill="#f6faf3" font-size="29" font-weight="700">Third-party rights</text><text x="595" y="657" fill="#b9d0c2" font-size="21">Code · data · adapters</text><rect x="1082" y="511" width="477" height="180" rx="23" fill="#14291f" stroke="#81a77d" stroke-width="2"/><text x="1104" y="560" fill="#c8ff4d" font-size="22">06 · APPROVAL</text><text x="1104" y="614" fill="#f6faf3" font-size="29" font-weight="700">Human evidence review</text><text x="1104" y="657" fill="#b9d0c2" font-size="21">Versioned sign-off</text><text x="70" y="846" fill="#a3c09c" font-size="21">License documents, derivative rights, data/privacy, and human decisions remain distinct.</text></g></svg>