<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Grok 4.3: Long-Context Cost Pipeline"><rect width="1600" height="900" fill="#0a151b"/><g font-family="Arial,sans-serif"><text x="68" y="82" fill="#c8ff4d" font-size="25" font-weight="700">SXF / AI · ORIGINAL LONG-CONTEXT ENGINEERING RESEARCH</text><text x="68" y="153" fill="#f3faee" font-size="47" font-weight="750">Grok 4.3: Long-Context Cost Pipeline</text><text x="68" y="210" fill="#aec9b4" font-size="23">Separate context capacity, routing decisions, cache hit rates and actual bills</text><rect x="63" y="279" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="88" y="328" fill="#c8ff4d" font-size="22">01 · INPUT</text><text x="88" y="380" fill="#f6fbf0" font-size="29" font-weight="700">Prompt tokens</text><text x="88" y="422" fill="#b4c9ba" font-size="20">Short vs long context</text><rect x="573" y="279" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="598" y="328" fill="#c8ff4d" font-size="22">02 · CACHE</text><text x="598" y="380" fill="#f6fbf0" font-size="29" font-weight="700">Actual cache hits</text><text x="598" y="422" fill="#b4c9ba" font-size="20">Do not assume 100%</text><rect x="1083" y="279" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="1108" y="328" fill="#c8ff4d" font-size="22">03 · EFFORT</text><text x="1108" y="380" fill="#f6fbf0" font-size="29" font-weight="700">Explicit reasoning</text><text x="1108" y="422" fill="#b4c9ba" font-size="20">Measure usage & latency</text><rect x="63" y="501" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="88" y="550" fill="#c8ff4d" font-size="22">04 · TOOLS</text><text x="88" y="602" fill="#f6fbf0" font-size="29" font-weight="700">Validated functions</text><text x="88" y="644" fill="#b4c9ba" font-size="20">Guard side effects</text><rect x="573" y="501" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="598" y="550" fill="#c8ff4d" font-size="22">05 · BILL</text><text x="598" y="602" fill="#f6fbf0" font-size="29" font-weight="700">xAI cost ticks</text><text x="598" y="644" fill="#b4c9ba" font-size="20">Reconcile real invoices</text><rect x="1083" y="501" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="1108" y="550" fill="#c8ff4d" font-size="22">06 · QUALITY</text><text x="1108" y="602" fill="#f6fbf0" font-size="29" font-weight="700">Human-grounded eval</text><text x="1108" y="644" fill="#b4c9ba" font-size="20">Sources, tasks, failure</text><text x="69" y="844" font-size="20" fill="#9dbda7">Published pricing + original synthetic usage simulation ≠ independent model quality benchmark.</text></g></svg>