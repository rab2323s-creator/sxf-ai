<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Grok 4.3: The 200K Pricing Boundary"><rect width="1600" height="900" fill="#0a151b"/><g font-family="Arial,sans-serif"><text x="68" y="82" fill="#c8ff4d" font-size="25" font-weight="700">SXF / AI · ORIGINAL LONG-CONTEXT ENGINEERING RESEARCH</text><text x="68" y="153" fill="#f3faee" font-size="47" font-weight="750">Grok 4.3: The 200K Pricing Boundary</text><text x="68" y="210" fill="#aec9b4" font-size="23">xAI-published USD per million tokens for context threshold and Batch</text><rect x="63" y="279" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="88" y="328" fill="#c8ff4d" font-size="22">SHORT INPUT</text><text x="88" y="380" fill="#f6fbf0" font-size="29" font-weight="700">$1.25 / 1M</text><text x="88" y="422" fill="#b4c9ba" font-size="20">Prompt under 200K</text><rect x="573" y="279" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="598" y="328" fill="#c8ff4d" font-size="22">SHORT CACHED</text><text x="598" y="380" fill="#f6fbf0" font-size="29" font-weight="700">$0.20 / 1M</text><text x="598" y="422" fill="#b4c9ba" font-size="20">Only actual cache hits</text><rect x="1083" y="279" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="1108" y="328" fill="#c8ff4d" font-size="22">SHORT OUTPUT</text><text x="1108" y="380" fill="#f6fbf0" font-size="29" font-weight="700">$2.50 / 1M</text><text x="1108" y="422" fill="#b4c9ba" font-size="20">Reasoning counts in usage</text><rect x="63" y="501" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="88" y="550" fill="#c8ff4d" font-size="22">LONG INPUT</text><text x="88" y="602" fill="#f6fbf0" font-size="29" font-weight="700">$2.50 / 1M</text><text x="88" y="644" fill="#b4c9ba" font-size="20">Prompt at least 200K</text><rect x="573" y="501" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="598" y="550" fill="#c8ff4d" font-size="22">LONG CACHED</text><text x="598" y="602" fill="#f6fbf0" font-size="29" font-weight="700">$0.40 / 1M</text><text x="598" y="644" fill="#b4c9ba" font-size="20">Regional rates may differ</text><rect x="1083" y="501" width="474" height="176" rx="22" fill="#142a20" stroke="#77a083"/><text x="1108" y="550" fill="#c8ff4d" font-size="22">LONG OUTPUT</text><text x="1108" y="602" fill="#f6fbf0" font-size="29" font-weight="700">$5.00 / 1M</text><text x="1108" y="644" fill="#b4c9ba" font-size="20">Batch discount 20%</text><text x="69" y="844" font-size="20" fill="#9dbda7">Published pricing + original synthetic usage simulation ≠ independent model quality benchmark.</text></g></svg>