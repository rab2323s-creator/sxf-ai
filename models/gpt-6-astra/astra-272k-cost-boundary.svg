<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title desc">
<title id="title">GPT-6 Astra price discontinuity after 272,000 input tokens</title>
<desc id="desc">SXF's deterministic Standard API pricing calculation for two uncached requests with 4,000 output tokens. At 272,000 input tokens the price is $2.92000; at 272,001 input tokens the price is $5.74002, a 96.6 percent increase. Rates for the full request change at the threshold, not only for one extra token. Not a live invoice.</desc>
