<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Scribe v2 Realtime: a safe event pipeline"><rect width="1600" height="900" fill="#08131a"/><g font-family="Arial,sans-serif"><text x="65" y="85" fill="#c8ff4d" font-size="25" font-weight="800">SXF / AI · ORIGINAL REALTIME AUDIO REFERENCE</text><text x="65" y="158" fill="#f5f9f1" font-size="48" font-weight="750">Scribe v2 Realtime: a safe event pipeline</text><text x="65" y="215" fill="#b6cdc0" font-size="24">Microphone → authorization → WebSocket → provisional / committed UI</text><rect x="63" y="285" width="475" height="174" rx="20" fill="#162a22" stroke="#819d74" stroke-width="2"/><text x="88" y="332" fill="#c8ff4d" font-size="21">CAPTURE</text><text x="88" y="389" fill="#f5f9ed" font-weight="700" font-size="30">Consent + microphone</text><text x="88" y="429" fill="#b6cbc4" font-size="21">Mono PCM16 · 16 kHz</text><rect x="572" y="285" width="475" height="174" rx="20" fill="#162a22" stroke="#819d74" stroke-width="2"/><text x="597" y="332" fill="#c8ff4d" font-size="21">IDENTITY</text><text x="597" y="389" fill="#f5f9ed" font-weight="700" font-size="30">Single-use token</text><text x="597" y="429" fill="#b6cbc4" font-size="21">No permanent browser API key</text><rect x="1081" y="285" width="475" height="174" rx="20" fill="#162a22" stroke="#819d74" stroke-width="2"/><text x="1106" y="332" fill="#c8ff4d" font-size="21">STREAM</text><text x="1106" y="389" fill="#f5f9ed" font-weight="700" font-size="30">WSS audio chunks</text><text x="1106" y="429" fill="#b6cbc4" font-size="21">100-1000 ms guidance</text><rect x="63" y="505" width="475" height="174" rx="20" fill="#162a22" stroke="#819d74" stroke-width="2"/><text x="88" y="552" fill="#c8ff4d" font-size="21">INTERIM</text><text x="88" y="609" fill="#f5f9ed" font-weight="700" font-size="30">Partial transcript</text><text x="88" y="649" fill="#b6cbc4" font-size="21">Replace last draft</text><rect x="572" y="505" width="475" height="174" rx="20" fill="#162a22" stroke="#819d74" stroke-width="2"/><text x="597" y="552" fill="#c8ff4d" font-size="21">FINAL</text><text x="597" y="609" fill="#f5f9ed" font-weight="700" font-size="30">Committed transcript</text><text x="597" y="649" fill="#b6cbc4" font-size="21">Append exactly once</text><rect x="1081" y="505" width="475" height="174" rx="20" fill="#162a22" stroke="#819d74" stroke-width="2"/><text x="1106" y="552" fill="#c8ff4d" font-size="21">FAILURE</text><text x="1106" y="609" fill="#f5f9ed" font-weight="700" font-size="30">Error + recovery</text><text x="1106" y="649" fill="#b6cbc4" font-size="21">No silent fake final</text><text x="65" y="841" fill="#a9c6ac" font-size="20">Technical reference · Provider documents and actual commercial performance are separate</text></g></svg>