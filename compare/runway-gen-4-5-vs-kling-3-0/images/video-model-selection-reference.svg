<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Video Model Selection: Six-Step Workflow"><rect width="1600" height="900" fill="#0a151a"/><g font-family="Arial,sans-serif"><text x="65" y="82" fill="#c8ff4d" font-size="26" font-weight="800">SXF / AI · ORIGINAL VIDEO ENGINEERING REFERENCE</text><text x="65" y="160" fill="#f3f8f0" font-size="46" font-weight="800">Video Model Selection: Six-Step Workflow</text><text x="65" y="210" fill="#bac9c1" font-size="23">Model capabilities → equivalent clip inputs → human review → acceptance cost</text><rect x="60" y="280" width="478" height="180" rx="19" fill="#172a21" stroke="#85a57f" stroke-width="2"/><text x="82" y="326" fill="#c8ff4d" font-size="21">BRIEF</text><text x="82" y="384" fill="#f0f9ee" font-size="27" font-weight="750">Lock visual goals</text><text x="82" y="424" fill="#b1c7bc" font-size="21">Aspect, camera, references</text><rect x="570" y="280" width="478" height="180" rx="19" fill="#172a21" stroke="#85a57f" stroke-width="2"/><text x="592" y="326" fill="#c8ff4d" font-size="21">CANDIDATES</text><text x="592" y="384" fill="#f0f9ee" font-size="27" font-weight="750">Gen-4.5 / Kling 3.0</text><text x="592" y="424" fill="#b1c7bc" font-size="21">Standard, Pro, 4K</text><rect x="1080" y="280" width="478" height="180" rx="19" fill="#172a21" stroke="#85a57f" stroke-width="2"/><text x="1102" y="326" fill="#c8ff4d" font-size="21">RENDER</text><text x="1102" y="384" fill="#f0f9ee" font-size="27" font-weight="750">5s & 10s shared</text><text x="1102" y="424" fill="#b1c7bc" font-size="21">Equal prompts + settings</text><rect x="60" y="505" width="478" height="180" rx="19" fill="#172a21" stroke="#85a57f" stroke-width="2"/><text x="82" y="551" fill="#c8ff4d" font-size="21">ANALYZE</text><text x="82" y="609" fill="#f0f9ee" font-size="27" font-weight="750">Motion / audio</text><text x="82" y="649" fill="#b1c7bc" font-size="21">Continuity, lip-sync, text</text><rect x="570" y="505" width="478" height="180" rx="19" fill="#172a21" stroke="#85a57f" stroke-width="2"/><text x="592" y="551" fill="#c8ff4d" font-size="21">COST</text><text x="592" y="609" fill="#f0f9ee" font-size="27" font-weight="750">Per usable clip</text><text x="592" y="649" fill="#b1c7bc" font-size="21">Every retry + review</text><rect x="1080" y="505" width="478" height="180" rx="19" fill="#172a21" stroke="#85a57f" stroke-width="2"/><text x="1102" y="551" fill="#c8ff4d" font-size="21">RELEASE</text><text x="1102" y="609" fill="#f0f9ee" font-size="27" font-weight="750">Approval and rights</text><text x="1102" y="649" fill="#b1c7bc" font-size="21">Consent, sources, archiving</text><text x="65" y="844" fill="#a8c8af" font-size="20">Source-backed published prices; original SXF simulation; not paid video-generation evidence.</text></g></svg>