<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="GPT Image 2 vs Flare: Creative Evaluation"><rect width="1600" height="900" fill="#09141c"/><g font-family="Arial,sans-serif"><text x="70" y="85" fill="#c8ff4d" font-size="25" font-weight="800">SXF / AI · ORIGINAL ENGINEERING FRAMEWORK</text><text x="70" y="158" fill="#f2f9f0" font-size="47" font-weight="800">GPT Image 2 vs Flare: Creative Evaluation</text><text x="70" y="211" fill="#bdd0bd" font-size="23">Compare equivalent prompts, track model token counts and accept-rate evidence</text><rect x="68" y="284" width="474" height="176" rx="22" fill="#152a21" stroke="#759b75"/><text x="90" y="331" fill="#c8ff4d" font-size="22">FIXTURE</text><text x="90" y="388" fill="#f3faec" font-size="28" font-weight="700">Same task & references</text><text x="90" y="429" fill="#aecaaf" font-size="20">Consent + brand specs</text><rect x="575" y="284" width="474" height="176" rx="22" fill="#152a21" stroke="#759b75"/><text x="597" y="331" fill="#c8ff4d" font-size="22">MODEL</text><text x="597" y="388" fill="#f3faec" font-size="28" font-weight="700">Image 2 / Flare</text><text x="597" y="429" fill="#aecaaf" font-size="20">Pinned model IDs</text><rect x="1082" y="284" width="474" height="176" rx="22" fill="#152a21" stroke="#759b75"/><text x="1104" y="331" fill="#c8ff4d" font-size="22">QUALITY</text><text x="1104" y="388" fill="#f3faec" font-size="28" font-weight="700">Explicit size & setting</text><text x="1104" y="429" fill="#aecaaf" font-size="20">No auto quality mismatch</text><rect x="68" y="507" width="474" height="176" rx="22" fill="#152a21" stroke="#759b75"/><text x="90" y="554" fill="#c8ff4d" font-size="22">REVIEW</text><text x="90" y="611" fill="#f3faec" font-size="28" font-weight="700">Blind human criteria</text><text x="90" y="652" fill="#aecaaf" font-size="20">Text, identity, composition</text><rect x="575" y="507" width="474" height="176" rx="22" fill="#152a21" stroke="#759b75"/><text x="597" y="554" fill="#c8ff4d" font-size="22">USAGE</text><text x="597" y="611" fill="#f3faec" font-size="28" font-weight="700">Text + image tokens</text><text x="597" y="652" fill="#aecaaf" font-size="20">Billed values / caching</text><rect x="1082" y="507" width="474" height="176" rx="22" fill="#152a21" stroke="#759b75"/><text x="1104" y="554" fill="#c8ff4d" font-size="22">DECISION</text><text x="1104" y="611" fill="#f3faec" font-size="28" font-weight="700">Cost / accepted asset</text><text x="1104" y="652" fill="#aecaaf" font-size="20">Latency + review effort</text><text x="70" y="845" fill="#a7c2aa" font-size="20">Model/vendor documentation and numerical simulations are not independent quality benchmarks.</text></g></svg>