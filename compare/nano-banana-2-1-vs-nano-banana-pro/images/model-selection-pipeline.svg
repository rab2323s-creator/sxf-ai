<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Nano Banana 2.1 vs Pro: Selection Pipeline"><rect width="1600" height="900" fill="#0a141c"/><g font-family="Arial,sans-serif"><text x="70" y="80" fill="#c8ff4d" font-size="25" font-weight="750">SXF / AI · ORIGINAL IMAGE ECONOMICS FRAMEWORK</text><text x="70" y="162" fill="#f3faf3" font-size="44" font-weight="800">Nano Banana 2.1 vs Pro: Selection Pipeline</text><text x="70" y="213" fill="#b5c9be" font-size="23">Brief → blind image trials → accepted-asset economics → rollout</text><rect x="60" y="284" width="479" height="176" rx="22" stroke="#82a478" fill="#15291f"/><text x="84" y="330" font-size="22" fill="#bfff6e">BRIEF</text><text x="84" y="383" font-size="28" fill="#f1f8f1" font-weight="750">Use-case rubric</text><text x="84" y="426" font-size="21" fill="#b0c9bb">Typography · brand · fidelity</text><rect x="570" y="284" width="479" height="176" rx="22" stroke="#82a478" fill="#15291f"/><text x="594" y="330" font-size="22" fill="#bfff6e">FIXTURE</text><text x="594" y="383" font-size="28" fill="#f1f8f1" font-weight="750">Same prompts</text><text x="594" y="426" font-size="21" fill="#b0c9bb">Same source images</text><rect x="1080" y="284" width="479" height="176" rx="22" stroke="#82a478" fill="#15291f"/><text x="1104" y="330" font-size="22" fill="#bfff6e">OUTPUT</text><text x="1104" y="383" font-size="28" fill="#f1f8f1" font-weight="750">1K / 2K / 4K</text><text x="1104" y="426" font-size="21" fill="#b0c9bb">Compare equivalent mode</text><rect x="60" y="505" width="479" height="176" rx="22" stroke="#82a478" fill="#15291f"/><text x="84" y="551" font-size="22" fill="#bfff6e">QUALITY</text><text x="84" y="604" font-size="28" fill="#f1f8f1" font-weight="750">Blind human review</text><text x="84" y="647" font-size="21" fill="#b0c9bb">Errors + edit effort</text><rect x="570" y="505" width="479" height="176" rx="22" stroke="#82a478" fill="#15291f"/><text x="594" y="551" font-size="22" fill="#bfff6e">COST</text><text x="594" y="604" font-size="28" fill="#f1f8f1" font-weight="750">Output + retries</text><text x="594" y="647" font-size="21" fill="#b0c9bb">Input + grounding too</text><rect x="1080" y="505" width="479" height="176" rx="22" stroke="#82a478" fill="#15291f"/><text x="1104" y="551" font-size="22" fill="#bfff6e">DEPLOY</text><text x="1104" y="604" font-size="28" fill="#f1f8f1" font-weight="750">Selective routing</text><text x="1104" y="647" font-size="21" fill="#b0c9bb">Review every model update</text><text x="68" y="844" font-size="21" fill="#a8bea9">No paid API image generation used. Vendor pricing and vendor-reported evals are distinct evidence classes.</text></g></svg>